<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F1EA">
<title>Jokenpy · aprenda Python construindo um Jokenpô</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Identidade: caderno de engenharia. Papel quadriculado, tinta escura, sombras duras deslocadas.
   As três cores de destaque vêm do jogo: pedra (coral), papel (azul) e tesoura (âmbar). */
:root{
  --fundo:#F4F1EA;--grade:#E6E0D2;--folha:#FFFDF8;
  --tinta:#17171F;--tinta-2:#44434D;--suave:#7A766C;
  --pedra:#E4572E;--pedra-claro:#FCE6DE;
  --azul:#2F6FDB;--azul-claro:#E2ECFC;
  --ambar:#E9A21B;--ambar-claro:#FBF0D6;
  --ok:#1E9A62;--ok-claro:#DDF3E7;
  --erro:#D22F45;--erro-claro:#FBE1E4;
  --cod:#17171F;--cod-txt:#EDE9DF;
  --raio:8px;--sombra:4px 4px 0 var(--tinta);
}
/* cada parte do curso tem a cor de um personagem: Pedra (coral), Papel (azul) e Tesoura (âmbar) */
.cor-pedra{--cor:var(--pedra);--cor-claro:var(--pedra-claro)}
.cor-papel{--cor:var(--azul);--cor-claro:var(--azul-claro)}
.cor-tesoura{--cor:var(--ambar);--cor-claro:var(--ambar-claro)}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--tinta);background:var(--fundo);
  background-image:linear-gradient(var(--grade) 1px,transparent 1px),linear-gradient(90deg,var(--grade) 1px,transparent 1px);
  background-size:26px 26px;-webkit-font-smoothing:antialiased;line-height:1.5}
h1,h2,h3{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
/* sem ligaduras: quem está aprendendo precisa ver == e != como dois caracteres */
code,pre,textarea,.peca,.teclas button,.lacuna{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}

/* botões: retângulos de tinta com sombra dura deslocada */
.btn{border:2px solid var(--tinta);border-radius:var(--raio);padding:11px 20px;font-weight:700;font-size:15px;
  color:var(--folha);background:var(--tinta);box-shadow:3px 3px 0 var(--pedra);transition:transform .06s,box-shadow .06s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--pedra)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:3px 3px 0 var(--grade)}
.btn.branco{background:var(--folha);color:var(--tinta);box-shadow:3px 3px 0 var(--tinta)}
.btn.branco:hover{box-shadow:4px 4px 0 var(--tinta)}
.btn.azul{background:var(--azul);box-shadow:3px 3px 0 var(--tinta)}
.btn.vermelho{background:var(--erro);box-shadow:3px 3px 0 var(--tinta)}
.btn.verde{background:var(--ok);box-shadow:3px 3px 0 var(--tinta)}
.btn.largo{width:100%}
.btn.grande{padding:14px 24px;font-size:16px}
.btn.mini{padding:7px 12px;font-size:13px;box-shadow:2px 2px 0 var(--tinta)}
.link{background:none;border:0;color:var(--suave);font-weight:600;text-decoration:underline;text-underline-offset:3px;display:block;margin:28px auto 0;font-size:14px}

.kicker{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--pedra)}
.tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  border:1.5px solid var(--tinta);border-radius:4px;padding:2px 7px;background:var(--folha);white-space:nowrap}
.tag.ok{background:var(--ok-claro);border-color:var(--ok);color:#13643F}
.tag.and{background:var(--ambar-claro);border-color:var(--ambar);color:#7A5200}
.tag.sug{background:var(--pedra);border-color:var(--tinta);color:#fff}

/* topo */
.topo{position:sticky;top:0;z-index:5;background:var(--fundo);border-bottom:2px solid var(--tinta)}
.topo-in{max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;gap:12px}
.marca{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;display:flex;align-items:center;gap:8px}
.marca-trio{display:flex;gap:1px;margin-right:2px}
.marca b{background:var(--tinta);color:var(--folha);padding:0 6px;border-radius:4px;margin-left:1px}
.stats{display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600}
.stat{border:1.5px solid var(--tinta);border-radius:6px;padding:3px 9px;background:var(--folha);white-space:nowrap}
.som{background:var(--folha);border:1.5px solid var(--tinta);border-radius:6px;font-size:15px;padding:2px 7px}

/* início */
.home{max-width:1080px;margin:0 auto;padding:28px 20px 56px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
.hero h1{font-size:40px;line-height:1.08;margin:10px 0 14px}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--ambar) 62%)}
.hero p.sub{font-size:17px;color:var(--tinta-2);margin:0 0 22px;max-width:46ch}
.hero-acoes{display:flex;gap:12px;flex-wrap:wrap}
.hero-acoes .btn{font-size:16px;padding:13px 22px}
.continuar-info{margin-top:14px;font-size:14px;color:var(--suave)}
.passos-home{list-style:none;counter-reset:p;margin:26px 0 0;padding:0;display:grid;gap:10px;max-width:46ch}
.passos-home li{counter-increment:p;display:flex;gap:12px;align-items:baseline;font-size:15px;color:var(--tinta-2)}
.passos-home li::before{content:"0" counter(p);font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--pedra);border:1.5px solid var(--tinta);border-radius:4px;padding:1px 6px;background:var(--folha)}
.passos-home b{color:var(--tinta)}
.passos-home code{background:var(--folha);border:1px solid var(--grade);padding:0 4px;border-radius:4px;font-size:.88em}

/* o arquivo jokenpo.py sendo montado */
.arquivo{border:2px solid var(--tinta);border-radius:var(--raio);background:var(--cod);box-shadow:var(--sombra);overflow:hidden}
.arquivo-topo{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#24242E;color:#B9B4A8;font-family:'IBM Plex Mono',monospace;font-size:12px}
.arquivo-topo .pers{margin-right:-3px}
.arquivo-topo span{margin-left:8px}
.arquivo-topo b{margin-left:auto;color:var(--ambar);font-weight:600}
.arquivo pre{margin:0;padding:14px 0;font-size:12.5px;line-height:1.7;color:var(--cod-txt);overflow-x:auto}
.arquivo .ln{display:block;padding:0 14px;white-space:pre}
.arquivo .ln.falta{color:#77738A;font-style:italic}
.arquivo-barra{height:5px;background:#2D2D38}.arquivo-barra div{height:100%;background:var(--ambar);transition:width .5s}

.secao-topo{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:44px 0 14px;flex-wrap:wrap}
.secao-topo h2{font-size:26px;margin:4px 0 0}
.secao-topo p{margin:0;color:var(--suave);font-size:14px}
.lista{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.item{position:relative}
.no{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--folha);border:2px solid var(--tinta);border-radius:var(--raio);
  padding:14px;box-shadow:3px 3px 0 var(--tinta);transition:transform .06s,box-shadow .06s;min-height:84px}
.no:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--cor,var(--tinta))}
.no .ico{font-size:24px;width:46px;height:46px;flex:none;display:grid;place-items:center;border:1.5px solid var(--tinta);border-radius:6px;background:var(--cor-claro,var(--fundo))}
.no .txt{flex:1;min-width:0}
.no .txt b{display:block;font-family:'Space Grotesk',sans-serif;font-size:17px;line-height:1.25}
.no .txt small{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--suave)}
.no .txt em{display:block;font-style:normal;color:var(--suave);font-size:13px;margin-top:2px;line-height:1.35}
.no .check{width:28px;height:28px;flex:none;border:2px solid var(--tinta);border-radius:6px;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:2px 2px 0 var(--tinta)}
.no .seta{font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--suave);padding-right:2px}
.no.sugerida{box-shadow:3px 3px 0 var(--pedra)}
.item.aberta .no{box-shadow:none;transform:translate(3px,3px)}
.cartao-licao{margin-top:10px;background:var(--tinta);color:var(--folha);border-radius:var(--raio);padding:14px 16px;animation:surgir .14s ease-out}
.cartao-licao p{margin:0 0 12px;font-size:14px;color:#D8D3C8}
.cartao-licao .acoes{display:flex;gap:10px;flex-wrap:wrap}
.cartao-licao .btn{background:var(--folha);color:var(--tinta);border-color:var(--folha);box-shadow:3px 3px 0 var(--pedra)}
.cartao-licao .btn.branco{background:transparent;color:var(--folha);border-color:#6C6977;box-shadow:none}
@keyframes surgir{from{opacity:0;transform:translateY(-6px)}}

.painel{border:2px solid var(--tinta);border-radius:var(--raio);background:var(--folha);padding:16px 18px;box-shadow:3px 3px 0 var(--tinta)}
.revisao{display:flex;align-items:center;gap:16px;margin-top:40px;background:var(--azul-claro)}
.revisao > div{flex:1}
.revisao b{display:block;font-family:'Space Grotesk',sans-serif;font-size:18px}
.revisao span{color:var(--tinta-2);font-size:14px}

/* partes do curso */
.ato{margin-top:44px}
.ato-topo{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--tinta)}
.ato-topo h2{margin:2px 0 0;font-size:25px;line-height:1.15}
.ato-topo .kicker{color:var(--cor)}
.ato-cont{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;border:1.5px solid var(--tinta);border-radius:4px;padding:2px 8px;background:var(--folha)}

/* personagens: rabiscos de tinta na margem do caderno */
.pers{display:block;flex:none;overflow:visible}
.pula{animation:pula .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pula{from{transform:scale(.6) rotate(-8deg)}}
.balanca{animation:balanca .5s ease-in-out}
@keyframes balanca{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}

/* lição */
.licao{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--fundo)}
.licao-topo{border-bottom:2px solid var(--tinta);background:var(--fundo)}
.licao-topo-in{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:820px;margin:0 auto}
.fechar{background:var(--folha);border:1.5px solid var(--tinta);border-radius:6px;font-size:15px;font-weight:700;padding:4px 10px}
.licao-meio{flex:1;min-width:0}
.licao-nome{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;min-width:0}
.licao-nome small{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--cor,var(--suave));text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.licao-nome b{font-family:'Space Grotesk',sans-serif;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.topo-btn{background:var(--folha);border:1.5px solid var(--tinta);border-radius:6px;padding:4px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.contador{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;white-space:nowrap}
.barra{height:10px;background:var(--folha);border:1.5px solid var(--tinta);border-radius:4px;overflow:hidden}
.barra div{height:100%;background:var(--cor,var(--pedra));transition:width .35s}
.barra.azul div{background:var(--cor,var(--azul))}
.corpo{flex:1;overflow-y:auto;width:100%}
.corpo-in{max-width:720px;margin:0 auto;padding:22px 20px 36px}
.entrar{animation:entrar .2s ease-out}
@keyframes entrar{from{opacity:0;transform:translateY(8px)}}
.corpo h2{font-size:24px;margin:6px 0 16px;line-height:1.25}
.corpo h2 code,.enunciado code,.fb code,.pagina code,.dicas code,.resumo code{background:var(--folha);border:1px solid var(--grade);padding:0 5px;border-radius:4px;font-size:.88em}

/* rodapé de ação */
.rodape{border-top:2px solid var(--tinta);background:var(--folha);padding:14px 20px}
.rodape-in{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rodape-esq,.rodape-dir{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rodape-dir{margin-left:auto}
.rodape.certo{background:var(--ok-claro);border-top-color:var(--ok)}
.rodape.errado{background:var(--erro-claro);border-top-color:var(--erro)}
.fb{display:flex;gap:12px;align-items:flex-start;flex:1;min-width:240px}
.fb-ico{flex:none}
.certo .fb{color:#12603C}.errado .fb{color:#8E1F2F}
.fb h3{margin:0 0 3px;font-size:19px}
.fb p{margin:0;font-size:14.5px;line-height:1.5;color:var(--tinta-2)}
.fb p small{color:var(--suave)}
.fb-acoes{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}

/* código */
pre.cod{background:var(--cod);color:var(--cod-txt);border-radius:var(--raio);border:2px solid var(--tinta);padding:13px 15px;font-size:13.5px;line-height:1.65;overflow-x:auto;margin:0 0 16px;white-space:pre}
.t-k{color:#FF9E7A}.t-s{color:#B8E07A}.t-c{color:#8A8697;font-style:italic}.t-n{color:#F4C95D}.t-f{color:#8CC2FF}

/* ensino */
.pagina{background:var(--folha);border:2px solid var(--tinta);border-radius:var(--raio);padding:20px 22px;box-shadow:var(--sombra)}
.pagina h2{margin:4px 0 10px}
.pagina-topo{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.pagina-topo h2{margin:0}
.pagina p,.pagina li{color:var(--tinta-2);font-size:15.5px;line-height:1.65}
.pagina ol,.pagina ul{padding-left:22px}
.ensino-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.pontos{display:flex;gap:5px}
.pontos i{width:22px;height:5px;background:var(--grade)}
.pontos i.visto{background:var(--cor-claro,#9DBDF0);outline:1px solid var(--cor,var(--azul))}
.pontos i.agora{background:var(--cor,var(--azul))}
.ensino-topo .kicker{color:var(--cor,var(--pedra))}
.rotulo{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--suave);margin:16px 0 6px}
#ex-saida{margin-top:12px}

/* escolha */
.opcoes{display:grid;gap:10px}
.opcao{display:flex;align-items:center;gap:12px;text-align:left;background:var(--folha);border:2px solid var(--tinta);border-radius:var(--raio);padding:13px 14px;font-weight:500;font-size:15.5px;box-shadow:2px 2px 0 var(--tinta)}
.opcao:hover{background:#fff}
.opcao .num{width:26px;height:26px;flex:none;border:1.5px solid var(--tinta);border-radius:4px;display:grid;place-items:center;font-size:12px;font-family:'IBM Plex Mono',monospace;font-weight:600}
.opcao.sel{background:var(--azul-claro);box-shadow:2px 2px 0 var(--azul)}
.opcao.sel .num{background:var(--azul);color:#fff;border-color:var(--azul)}
.opcao.ok{background:var(--ok-claro);border-color:var(--ok);box-shadow:2px 2px 0 var(--ok)}
.opcao.ruim{background:var(--erro-claro);border-color:var(--erro);box-shadow:2px 2px 0 var(--erro)}
.opcao code{font-size:14px}
.travado{pointer-events:none}

/* completar */
.lacuna{background:#2B2B36;border:0;border-bottom:2px solid var(--ambar);color:#fff;font-size:inherit;padding:0 4px;border-radius:3px 3px 0 0;outline:none;text-align:center}
.lacuna:focus{background:#3A3A48}
.lacuna.ok{border-color:#7FD69E;color:#B8F0CB}
.lacuna.ruim{border-color:#FF8A96;color:#FFC2C9}

/* montar */
.montagem{min-height:64px;border:2px dashed var(--tinta);border-radius:var(--raio);background:var(--folha);padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;align-content:flex-start}
.banco{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.peca{background:var(--folha);border:2px solid var(--tinta);border-radius:6px;padding:7px 11px;font-size:14.5px;font-weight:500;box-shadow:2px 2px 0 var(--tinta)}
.peca:active{transform:translate(2px,2px);box-shadow:none}
.peca.usada{background:var(--grade);color:transparent;box-shadow:none;border-style:dashed;pointer-events:none}
.montagem-vazia{color:var(--suave);font-size:14px;align-self:center}
.ajuda-montar{text-align:center;color:var(--suave);font-size:13.5px;margin-top:18px}

/* editor */
.enunciado{line-height:1.6;margin:-6px 0 14px;color:var(--tinta-2);font-size:15.5px}
.chips{margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--tinta);background:var(--folha);font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:5px}
.chip.verde{background:var(--ok-claro);border-color:var(--ok)}
.editor{border:2px solid var(--tinta);border-radius:var(--raio);overflow:hidden;background:var(--cod);margin-bottom:12px;box-shadow:3px 3px 0 var(--tinta)}
.editor-topo{display:flex;align-items:center;gap:12px;padding:7px 12px;background:#24242E;color:#B9B4A8;font-family:'IBM Plex Mono',monospace;font-size:12px}
.editor-topo .atalhos{margin-left:auto}
.recomecar{background:none;border:1px solid #4A4857;border-radius:5px;color:#D8D3C8;font-size:12px;padding:2px 8px}
.recomecar:hover{background:#34343F}
.editor textarea{display:block;width:100%;min-height:220px;resize:vertical;border:0;outline:none;background:transparent;color:var(--cod-txt);font-size:14px;line-height:1.65;padding:12px 15px;tab-size:4;white-space:pre;overflow:auto}
.editor.mini textarea{min-height:0}
.saida{border:2px solid var(--tinta);border-radius:var(--raio);overflow:hidden;background:var(--folha)}
.saida-topo{background:var(--fundo);border-bottom:1.5px solid var(--tinta);padding:5px 12px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.saida pre{margin:0;padding:11px 13px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;max-height:240px;overflow:auto}
.saida .err{color:var(--erro);font-weight:500}
.saida .vazio{color:var(--suave)}
.entender{border-top:1.5px solid var(--tinta);background:var(--ambar-claro);padding:10px 13px;font-size:14px;line-height:1.55}
.entender:empty{display:none}
.entender b{display:block;font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.entender code{background:var(--folha);padding:0 5px;border-radius:4px;font-size:.9em}

/* ferramentas, dicas e IA */
.ferramentas{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.ferr{background:var(--folha);border:1.5px solid var(--tinta);border-radius:6px;padding:6px 11px;font-weight:600;font-size:13.5px;box-shadow:2px 2px 0 var(--tinta)}
.ferr:active{transform:translate(2px,2px);box-shadow:none}
.ferr.ativo{background:var(--azul-claro)}
.dicas{border:2px solid var(--tinta);border-left:8px solid var(--ambar);border-radius:var(--raio);background:var(--folha);padding:12px 14px;margin:16px 0 14px}
.dicas ol{margin:0;padding-left:0;list-style:none;display:grid;gap:10px}
.dicas li{font-size:14.5px;line-height:1.55;color:var(--tinta-2)}
.dicas li small{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#8A5E00}
.dicas li.nova{animation:entrar .2s ease-out}
.dicas-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ia{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--tinta);border-left:8px solid var(--azul);border-radius:var(--raio);background:var(--folha);padding:12px 14px;margin:0 0 14px}
.ia-ico{font-size:22px;line-height:1}
.ia-texto{line-height:1.55;color:var(--tinta-2);white-space:pre-wrap;min-width:0;flex:1;font-size:14.5px}
.ia-texto small,.sugestao small,.previa small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;color:var(--azul)}
.ia-texto code{background:var(--fundo);padding:0 5px;border-radius:4px;font-size:.9em}
.ia-texto pre.cod{margin:8px 0 4px;white-space:pre}
.ia-erro{color:var(--erro)}
.pensando::after{content:"…";animation:piscar 1s infinite}
@keyframes piscar{50%{opacity:.2}}
.sugestao{border:2px dashed var(--azul);background:var(--azul-claro);border-radius:var(--raio);padding:10px 12px;margin:0 0 14px}
.sugestao pre.cod{margin:6px 0 10px}
.sugestao-acoes{display:flex;gap:8px;flex-wrap:wrap}
.previa{border:2px solid var(--tinta);border-radius:var(--raio);background:var(--folha);padding:10px 12px;margin:0 0 14px}
.previa-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.previa small{color:var(--suave);margin:0}
.previa pre.cod{margin:0}

/* teclas de código no celular */
.teclas{display:flex;gap:6px;overflow-x:auto;margin:-2px 0 12px;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.teclas button{flex:none;min-width:40px;height:40px;border:1.5px solid var(--tinta);border-radius:6px;background:var(--folha);font-weight:600;font-size:16px;padding:0 10px;box-shadow:2px 2px 0 var(--tinta)}
.teclas button:active{transform:translate(2px,2px);box-shadow:none}

/* resultado */
.resultado{max-width:640px;margin:0 auto;padding:40px 20px 56px}
.resultado-topo{text-align:center}
.trofeu{display:flex;justify-content:center;gap:6px;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.resultado h1{font-size:32px;margin:6px 0 6px}
.resultado-topo > p{color:var(--tinta-2);margin:0 0 6px}
.cartoes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
.cartao{border:2px solid var(--tinta);border-radius:var(--raio);background:var(--folha);padding:12px 10px;text-align:center;box-shadow:3px 3px 0 var(--tinta)}
.cartao small{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave)}
.cartao b{display:block;font-family:'Space Grotesk',sans-serif;font-size:24px;margin-top:2px}
.resumo{margin:0 0 22px}
.resumo h3{font-size:18px;margin:0 0 10px}
.resumo ul{margin:0;padding-left:20px;display:grid;gap:6px}
.resumo li{color:var(--tinta-2);line-height:1.55}
.resultado-acoes{display:grid;gap:12px}
.caixa-fim{border:2px solid var(--tinta);border-radius:var(--raio);background:var(--folha);padding:16px 18px;margin-bottom:20px;box-shadow:3px 3px 0 var(--tinta)}
.caixa-fim h3{margin:0 0 8px;font-size:18px}
.caixa-fim p,.caixa-fim li{color:var(--tinta-2);line-height:1.55}
.caixa-fim code{background:var(--fundo);padding:0 5px;border-radius:4px;font-size:.88em;word-break:break-all}
.caixa-fim pre.cod{margin:10px 0}
.caixa-fim .btn{margin:6px 0 10px}
.aprendeu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 26px}
.aprendeu span{border:1.5px solid var(--tinta);background:var(--folha);font-size:13px;font-weight:500;padding:4px 10px;border-radius:5px}
.confete{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.confete span{position:absolute;top:-50px;font-size:24px;animation:cair 2.6s ease-in forwards}
@keyframes cair{to{transform:translateY(115vh) rotate(540deg)}}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--tinta);color:var(--folha);padding:9px 15px;border-radius:6px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:3px 3px 0 var(--pedra)}

/* janela de resumo/teoria */
.modal-fundo{position:fixed;inset:0;background:rgba(23,23,31,.5);display:grid;place-items:center;padding:16px;z-index:30;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--folha);border:2px solid var(--tinta);border-radius:var(--raio);box-shadow:6px 6px 0 var(--tinta);max-width:660px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:22px;position:relative}
.modal-fechar{position:absolute;top:10px;right:12px;background:var(--folha);border:1.5px solid var(--tinta);border-radius:6px;font-weight:700;padding:2px 8px}
.modal .resumo{background:var(--ambar-claro);border:1.5px solid var(--tinta);border-radius:6px;padding:12px 14px;margin:12px 0 6px}
.teoria-cartao{border-bottom:1.5px dashed var(--grade);padding:6px 0 10px}
.teoria-cartao:last-of-type{border-bottom:0}
.teoria-cartao h3{margin:12px 0 4px;font-size:17px}
.teoria-cartao p,.teoria-cartao li{line-height:1.6;color:var(--tinta-2);font-size:15px}
.teoria-cartao code{background:var(--fundo);padding:0 5px;border-radius:4px;font-size:.88em}
.teoria-cartao pre.cod{margin:8px 0 6px}
.modal .btn.largo{margin-top:10px}

.aviso{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:25;background:var(--ambar-claro);border:2px solid var(--tinta);border-radius:6px;padding:9px 13px;font-weight:600;font-size:13.5px;width:max-content;max-width:calc(100% - 32px);box-shadow:3px 3px 0 var(--tinta)}
.aviso code{background:var(--folha);padding:0 5px;border-radius:4px;word-break:break-all}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .hero h1{font-size:32px}
  .lista{grid-template-columns:1fr}
}
@media (max-width:520px){
  .topo-in{padding:9px 14px}
  .stat.dias{display:none}
  .home{padding:20px 14px 48px}
  .hero h1{font-size:28px}
  .hero p.sub{font-size:15.5px}
  .hero-acoes .btn{flex:1 1 100%}
  .ato-topo h2{font-size:21px}
  .pagina-topo .pers{width:40px;height:40px}
  .fb-ico .pers{width:42px;height:42px}
  .uma-linha .rodape-esq{width:auto}
  .uma-linha .rodape-dir{width:auto;flex:1;flex-wrap:nowrap}
  .arquivo pre{font-size:11px}
  .licao-topo-in{padding:9px 14px;gap:10px}
  .topo-btn span{display:none}
  .corpo-in{padding:18px 14px 32px}
  .corpo h2{font-size:21px}
  .pagina{padding:16px}
  .rodape{padding:12px 14px}
  .rodape .btn{padding:11px 14px}
  .rodape-esq,.rodape-dir{width:100%}
  .rodape-esq .btn,.rodape-dir .btn{flex:1}
  .rodape-in > #principal{flex:1 1 100%}
  .uma-linha .rodape-esq{width:auto}
  .uma-linha .rodape-dir{width:auto;flex:1;flex-wrap:nowrap}
  .passos-home{display:none}
  .fb-acoes{width:100%}
  .fb-acoes .btn{flex:1}
  .revisao{flex-wrap:wrap}
  .revisao .btn{width:100%}
  .editor textarea{min-height:170px;font-size:13px}
  .editor-topo .atalhos{display:none}
  .recomecar{margin-left:auto}
  .cartoes{gap:8px}
  .cartao b{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

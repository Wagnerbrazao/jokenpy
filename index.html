<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFF9F2">
<title>Jokenpy · aprenda Python construindo um Jokenpô</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Visual amigável: branco quente, cantos arredondados, sombras suaves.
   Cada personagem do jogo tem uma cor: Pedra (coral), Papel (azul) e Tesoura (menta).
   Elas colorem as lições; o roxo é a cor das ações. */
:root{
  --fundo:#FFF9F2;--card:#FFFFFF;--linha:#EFE7DC;--linha-2:#E2D8CA;
  --tinta:#2B2440;--tinta-2:#5B5670;--suave:#8C879C;
  --marca:#6C5CE7;--marca-esc:#5646D6;--marca-claro:#EFEBFF;
  --pedra:#FF8A65;--pedra-esc:#E0603A;--pedra-claro:#FFEDE6;
  --papel:#6C9BFF;--papel-esc:#3D6FE0;--papel-claro:#E8F0FF;
  --tesoura:#2FC79E;--tesoura-esc:#14967A;--tesoura-claro:#E2F8F1;
  --ok:#1FAF7A;--ok-claro:#E3F7EE;--erro:#E5546A;--erro-claro:#FFEEF0;
  --sol:#FFC94D;--sol-claro:#FFF6DD;
  --cod:#2B2440;--cod-txt:#F4EFFF;
  --sombra:0 1px 2px rgba(43,36,64,.05),0 8px 24px rgba(43,36,64,.07);
  --sombra-forte:0 2px 4px rgba(43,36,64,.06),0 14px 34px rgba(43,36,64,.12);
}
.cor-pedra{--cor:var(--pedra);--cor-esc:var(--pedra-esc);--cor-claro:var(--pedra-claro)}
.cor-papel{--cor:var(--papel);--cor-esc:var(--papel-esc);--cor-claro:var(--papel-claro)}
.cor-tesoura{--cor:var(--tesoura);--cor-esc:var(--tesoura-esc);--cor-claro:var(--tesoura-claro)}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--tinta);background:var(--fundo);-webkit-font-smoothing:antialiased;line-height:1.55}
h1,h2,h3{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;letter-spacing:-.005em}
button{font:inherit;cursor:pointer;color:inherit}
/* sem ligaduras: quem está aprendendo precisa ver == e != como dois caracteres */
code,pre,textarea,.peca,.teclas button,.lacuna{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0}
:focus-visible{outline:3px solid #A99CFF;outline-offset:2px}

/* botões */
.btn{border:0;border-radius:14px;padding:12px 22px;font-weight:700;font-size:15.5px;color:#fff;background:var(--marca);
  box-shadow:0 6px 16px rgba(108,92,231,.28);transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover{background:var(--marca-esc);transform:translateY(-1px);box-shadow:0 8px 20px rgba(108,92,231,.34)}
.btn:active{transform:translateY(1px);box-shadow:0 3px 8px rgba(108,92,231,.25)}
.btn:disabled{background:#DCD6E8;color:#fff;box-shadow:none;cursor:default;transform:none}
.btn.branco{background:var(--card);color:var(--tinta);box-shadow:inset 0 0 0 1.5px var(--linha-2)}
.btn.branco:hover{background:#FCFAF7;box-shadow:inset 0 0 0 1.5px var(--suave)}
.btn.azul{background:var(--papel-esc);box-shadow:0 6px 16px rgba(61,111,224,.28)}
.btn.vermelho{background:var(--erro);box-shadow:0 6px 16px rgba(229,84,106,.28)}
.btn.verde{background:var(--ok);box-shadow:0 6px 16px rgba(31,175,122,.28)}
.btn.grande{padding:15px 26px;font-size:16.5px;border-radius:16px}
.btn.largo{width:100%}
.btn.mini{padding:8px 14px;font-size:13.5px;border-radius:11px}
.link{background:none;border:0;color:var(--suave);font-weight:500;text-decoration:underline;text-underline-offset:3px;display:block;margin:30px auto 0;font-size:14px}

.kicker{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--marca)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:4px 10px;background:var(--fundo);color:var(--tinta-2);white-space:nowrap}
.tag.ok{background:var(--ok-claro);color:var(--ok)}
.tag.and{background:var(--sol-claro);color:#9A6B00}
.tag.sug{background:var(--marca);color:#fff}

/* personagens */
.pers{display:block;flex:none;overflow:visible}
.flutua{animation:flutua 3.2s ease-in-out infinite}
.f2{animation-delay:-1.1s}.f3{animation-delay:-2.2s}
@keyframes flutua{50%{transform:translateY(-10px) rotate(-2deg)}}
.pula{animation:pula .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes pula{from{transform:scale(.6) translateY(8px)}}
.balanca{animation:balanca .5s ease-in-out}
@keyframes balanca{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

/* topo */
.topo{position:sticky;top:0;z-index:5;background:rgba(255,249,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha)}
.topo-in{max-width:1040px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;gap:12px}
.marca{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;display:flex;align-items:center;gap:10px}
.marca-trio{display:flex}.marca-trio .pers{margin-right:-6px}
.stats{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:700}
.stat{background:var(--card);border-radius:99px;padding:5px 12px;box-shadow:var(--sombra);white-space:nowrap}
.som{background:var(--card);border:0;border-radius:99px;font-size:15px;padding:5px 10px;box-shadow:var(--sombra)}

/* início */
.home{max-width:1040px;margin:0 auto;padding:24px 20px 56px}
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:center;border-radius:28px;padding:40px 40px 36px;
  background:radial-gradient(circle at 85% 20%,#FFFFFF 0,transparent 45%),linear-gradient(135deg,var(--pedra-claro) 0%,var(--marca-claro) 52%,var(--tesoura-claro) 100%);overflow:hidden}
.hero h1{font-size:44px;line-height:1.1;margin:10px 0 14px}
.hero h1 .p1{color:var(--pedra-esc)}.hero h1 .p2{color:var(--papel-esc)}.hero h1 .p3{color:var(--tesoura-esc)}
.hero p.sub{font-size:17px;color:var(--tinta-2);margin:0 0 24px;max-width:44ch}
.hero-acoes{display:flex;gap:12px;flex-wrap:wrap}
.continuar-info{margin:16px 0 0;font-size:14.5px;color:var(--tinta-2)}
.hero-arte{position:relative;display:flex;justify-content:center;align-items:flex-end;padding-top:56px}
.hero-arte .pers{margin:0 -10px;filter:drop-shadow(0 12px 14px rgba(43,36,64,.14))}
.hero-arte .pers-papel{margin-bottom:26px}
.bolha-fala{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--card);border-radius:16px;padding:9px 14px;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;box-shadow:var(--sombra);white-space:nowrap}
.bolha-fala::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-8px;width:16px;height:16px;background:var(--card);transform:rotate(45deg);border-radius:3px}

/* o seu jokenpo.py */
.seu-jogo{margin-top:18px;background:var(--card);border-radius:22px;box-shadow:var(--sombra);padding:16px 18px}
.seu-jogo-topo{display:flex;align-items:center;gap:14px}
.anel{--p:0;width:54px;height:54px;flex:none;border-radius:50%;background:conic-gradient(var(--marca) calc(var(--p)*1%),var(--linha) 0);display:grid;place-items:center}
.anel span{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:12.5px;font-weight:700}
.seu-jogo-txt{flex:1;min-width:0}
.seu-jogo-txt b{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px}
.seu-jogo-txt b code{font-size:.9em}
.seu-jogo-txt span{color:var(--suave);font-size:14px}
.arquivo{margin-top:14px;border-radius:16px;background:var(--cod);overflow:hidden}
.arquivo pre{margin:0;padding:16px 0;font-size:12.5px;line-height:1.7;color:var(--cod-txt);overflow-x:auto}
.arquivo .ln{display:block;padding:0 16px;white-space:pre}
.arquivo .ln.falta{color:#8F86AD;font-style:italic}

/* atos e lições */
.ato{margin-top:34px}
.ato-topo{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ato-topo h2{margin:0;font-size:24px;line-height:1.2}
.ato-topo .kicker{color:var(--suave)}
.ato-cont{margin-left:auto;font-weight:700;color:var(--suave);font-size:14px;background:var(--card);border-radius:99px;padding:4px 12px;box-shadow:var(--sombra)}
.lista{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.item{position:relative}
.no{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid transparent;border-radius:20px;
  padding:14px 16px;box-shadow:var(--sombra);transition:transform .15s,box-shadow .15s,border-color .15s;min-height:86px}
.no:hover{transform:translateY(-2px);box-shadow:var(--sombra-forte);border-color:var(--cor-claro)}
.no .ico{font-size:24px;width:50px;height:50px;flex:none;display:grid;place-items:center;border-radius:16px;background:var(--cor-claro)}
.no .txt{flex:1;min-width:0}
.no .txt small{display:block;font-size:12px;font-weight:700;color:var(--cor-esc);text-transform:uppercase;letter-spacing:.05em}
.no .txt b{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;line-height:1.25}
.no .txt em{display:block;font-style:normal;color:var(--suave);font-size:13.5px;margin-top:1px;line-height:1.35}
.no .check{width:30px;height:30px;flex:none;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.no .seta{font-size:26px;color:var(--linha-2);font-weight:300;padding-right:4px}
.no.sugerida{border-color:var(--marca);box-shadow:0 0 0 5px var(--marca-claro),var(--sombra)}
.item.aberta .no{border-color:var(--cor);border-bottom-left-radius:8px;border-bottom-right-radius:8px}
.cartao-licao{margin-top:6px;background:var(--cor-claro);border-radius:8px 8px 20px 20px;padding:14px 16px;animation:surgir .16s ease-out}
.cartao-licao p{margin:0 0 12px;font-size:14.5px;color:var(--tinta-2)}
.cartao-licao .acoes{display:flex;gap:10px;flex-wrap:wrap}
@keyframes surgir{from{opacity:0;transform:translateY(-6px)}}

.painel{background:var(--card);border-radius:22px;padding:16px 18px;box-shadow:var(--sombra)}
.revisao{display:flex;align-items:center;gap:16px;margin-top:34px;background:linear-gradient(120deg,var(--papel-claro),var(--marca-claro))}
.revisao > div{flex:1}
.revisao b{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px}
.revisao span{color:var(--tinta-2);font-size:14.5px}

/* lição */
.licao{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--fundo)}
.licao-topo{background:var(--card);border-bottom:1px solid var(--linha)}
.licao-topo-in{display:flex;align-items:center;gap:14px;padding:10px 20px;max-width:820px;margin:0 auto}
.fechar{width:38px;height:38px;flex:none;border:0;border-radius:50%;background:var(--fundo);font-size:16px;font-weight:700;color:var(--tinta-2)}
.fechar:hover{background:var(--linha)}
.licao-meio{flex:1;min-width:0}
.licao-nome{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;min-width:0}
.licao-nome small{font-size:12px;font-weight:700;color:var(--cor-esc);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.licao-nome b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.contador{font-size:13px;font-weight:700;color:var(--suave);white-space:nowrap}
.topo-btn{border:0;background:var(--fundo);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;white-space:nowrap;color:var(--tinta-2)}
.topo-btn:hover{background:var(--linha)}
.barra{height:10px;background:var(--linha);border-radius:99px;overflow:hidden}
.barra div{height:100%;background:var(--cor,var(--marca));border-radius:99px;transition:width .4s cubic-bezier(.3,1.4,.5,1)}
.barra.azul div{background:var(--cor,var(--marca))}
.corpo{flex:1;overflow-y:auto;width:100%}
.corpo-in{max-width:700px;margin:0 auto;padding:24px 20px 36px}
.entrar{animation:entrar .22s ease-out}
@keyframes entrar{from{opacity:0;transform:translateY(10px)}}
.corpo h2{font-size:25px;margin:6px 0 16px;line-height:1.25}
.corpo h2 code,.enunciado code,.fb code,.pagina code,.dicas code,.resumo code{background:var(--marca-claro);color:#4433B8;padding:1px 6px;border-radius:7px;font-size:.86em}

/* rodapé */
.rodape{background:var(--card);border-top:1px solid var(--linha);padding:14px 20px;transition:background .2s}
.rodape-in{max-width:700px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rodape-esq,.rodape-dir{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rodape-dir{margin-left:auto}
.rodape.certo{background:var(--ok-claro);border-top-color:transparent}
.rodape.errado{background:var(--erro-claro);border-top-color:transparent}
.fb{display:flex;gap:14px;align-items:flex-start;flex:1;min-width:240px}
.fb-ico{flex:none}
.certo h3{color:#14855B}.errado h3{color:#C23A50}
.fb h3{margin:2px 0 3px;font-size:21px}
.fb p{margin:0;font-size:15px;line-height:1.5;color:var(--tinta-2)}
.fb p small{color:var(--suave)}
.fb-acoes{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
.rodape.certo .btn:not(.branco){background:var(--ok);box-shadow:0 6px 16px rgba(31,175,122,.3)}

/* código */
pre.cod{background:var(--cod);color:var(--cod-txt);border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.65;overflow-x:auto;margin:0 0 16px;white-space:pre}
.t-k{color:#FF9BCB}.t-s{color:#9EF0C8}.t-c{color:#8F86AD;font-style:italic}.t-n{color:#FFD479}.t-f{color:#9CC2FF}

/* ensino */
.pagina{background:var(--card);border-radius:24px;padding:22px 24px;box-shadow:var(--sombra)}
.pagina-topo{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.pagina-topo h2{margin:0}
.pagina p,.pagina li{color:var(--tinta-2);font-size:16px;line-height:1.7}
.pagina ol,.pagina ul{padding-left:22px}
.ensino-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.ensino-topo .kicker{color:var(--cor-esc)}
.pontos{display:flex;gap:6px}
.pontos i{width:8px;height:8px;border-radius:99px;background:var(--linha-2);transition:width .2s}
.pontos i.visto{background:var(--cor)}
.pontos i.agora{background:var(--cor);width:22px}
.rotulo{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);margin:18px 0 6px}
#ex-saida{margin-top:12px}

/* escolha */
.opcoes{display:grid;gap:10px}
.opcao{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--linha);border-radius:16px;padding:14px 16px;font-weight:500;font-size:16px;transition:border-color .12s,background .12s}
.opcao:hover{border-color:#CFC6F5}
.opcao .num{width:28px;height:28px;flex:none;border-radius:9px;background:var(--fundo);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--suave)}
.opcao.sel{border-color:var(--marca);background:var(--marca-claro)}
.opcao.sel .num{background:var(--marca);color:#fff}
.opcao.ok{border-color:var(--ok);background:var(--ok-claro)}
.opcao.ok .num{background:var(--ok);color:#fff}
.opcao.ruim{border-color:var(--erro);background:var(--erro-claro)}
.opcao.ruim .num{background:var(--erro);color:#fff}
.opcao code{font-size:14.5px}
.travado{pointer-events:none}

/* completar */
.lacuna{background:#3D3457;border:0;border-bottom:2px solid var(--sol);color:#fff;font-size:inherit;padding:0 4px;border-radius:5px 5px 0 0;outline:none;text-align:center}
.lacuna:focus{background:#4A4068}
.lacuna.ok{border-color:#7DE8B9;color:#B9F5DA}
.lacuna.ruim{border-color:#FF8C9D;color:#FFC4CD}

/* montar */
.montagem{min-height:68px;border:2px dashed var(--linha-2);border-radius:18px;background:var(--card);padding:12px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;align-content:flex-start}
.banco{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.peca{background:var(--card);border:2px solid var(--linha);border-radius:12px;padding:8px 12px;font-size:14.5px;font-weight:500;box-shadow:0 2px 6px rgba(43,36,64,.06);transition:transform .1s}
.peca:hover{border-color:#CFC6F5}
.peca:active{transform:scale(.96)}
.peca.usada{background:var(--linha);border-color:var(--linha);color:transparent;box-shadow:none;pointer-events:none}
.montagem-vazia{color:var(--suave);font-size:14px;align-self:center;padding-left:4px}
.ajuda-montar{text-align:center;color:var(--suave);font-size:14px;margin-top:18px}

/* editor */
.enunciado{line-height:1.65;margin:-6px 0 14px;color:var(--tinta-2);font-size:16px}
.chips{margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--papel-claro);color:var(--papel-esc);font-size:13px;font-weight:700;padding:4px 11px;border-radius:99px}
.chip.verde{background:var(--ok-claro);color:var(--ok)}
.editor{border-radius:18px;overflow:hidden;background:var(--cod);margin-bottom:12px;box-shadow:var(--sombra)}
.editor-topo{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#362E50;color:#BDB3DA;font-family:'JetBrains Mono',monospace;font-size:12px}
.editor-topo .atalhos{margin-left:auto}
.recomecar{background:none;border:1px solid #5A5078;border-radius:8px;color:#E3DDF5;font-size:12px;padding:3px 9px}
.recomecar:hover{background:#463D63}
.editor textarea{display:block;width:100%;min-height:220px;resize:vertical;border:0;outline:none;background:transparent;color:var(--cod-txt);font-size:14px;line-height:1.65;padding:12px 16px;tab-size:4;white-space:pre;overflow:auto}
.editor.mini textarea{min-height:0}
.saida{border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--sombra)}
.saida-topo{background:#F7F3EE;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}
.saida pre{margin:0;padding:12px 14px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;max-height:240px;overflow:auto}
.saida .err{color:var(--erro);font-weight:500}
.saida .vazio{color:var(--suave)}
.entender{background:var(--sol-claro);padding:11px 14px;font-size:14.5px;line-height:1.55}
.entender:empty{display:none}
.entender b{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:#9A6B00;margin-bottom:2px}
.entender code{background:var(--card);padding:1px 6px;border-radius:6px;font-size:.9em}

/* ferramentas, dicas e IA */
.ferramentas{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.ferr{background:var(--card);border:0;border-radius:12px;padding:8px 13px;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1.5px var(--linha-2)}
.ferr:hover{background:#FCFAF7}
.ferr.ativo{background:var(--marca-claro);box-shadow:inset 0 0 0 1.5px #CFC6F5}
.dicas{background:var(--sol-claro);border-radius:18px;padding:14px 16px;margin:16px 0 14px}
.dicas ol{margin:0;padding-left:0;list-style:none;display:grid;gap:10px}
.dicas li{font-size:15px;line-height:1.55;color:var(--tinta-2);background:var(--card);border-radius:12px;padding:10px 12px}
.dicas li small{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9A6B00;margin-bottom:2px}
.dicas li.nova{animation:entrar .22s ease-out}
.dicas-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ia{display:flex;gap:10px;align-items:flex-start;background:var(--marca-claro);border-radius:18px;padding:12px 14px;margin:0 0 14px}
.ia-ico{font-size:22px;line-height:1}
.ia-texto{line-height:1.55;color:var(--tinta-2);white-space:pre-wrap;min-width:0;flex:1;font-size:15px}
.ia-texto small,.sugestao small,.previa small{display:block;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;color:var(--marca)}
.ia-texto code{background:var(--card);padding:1px 6px;border-radius:6px;font-size:.9em}
.ia-texto pre.cod{margin:8px 0 4px;white-space:pre}
.ia-erro{color:var(--erro)}
.pensando::after{content:"…";animation:piscar 1s infinite}
@keyframes piscar{50%{opacity:.2}}
.sugestao{border:2px dashed #CFC6F5;background:var(--marca-claro);border-radius:16px;padding:10px 12px;margin:0 0 14px}
.sugestao pre.cod{margin:6px 0 10px}
.sugestao-acoes{display:flex;gap:8px;flex-wrap:wrap}
.previa{background:var(--card);border-radius:16px;padding:12px 14px;margin:0 0 14px;box-shadow:var(--sombra)}
.previa-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.previa small{color:var(--suave);margin:0}
.previa pre.cod{margin:0}

/* teclas de código no celular */
.teclas{display:flex;gap:6px;overflow-x:auto;margin:-2px 0 12px;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.teclas button{flex:none;min-width:42px;height:42px;border:0;border-radius:12px;background:var(--card);font-weight:600;font-size:16px;padding:0 10px;box-shadow:inset 0 0 0 1.5px var(--linha-2)}
.teclas button:active{background:var(--marca-claro)}

/* resultado */
.resultado{max-width:620px;margin:0 auto;padding:40px 20px 56px}
.resultado-topo{text-align:center}
.trofeu{display:flex;justify-content:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.trofeu .pers{margin:0 -4px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.resultado h1{font-size:34px;margin:8px 0 6px}
.resultado-topo > p{color:var(--tinta-2);margin:0 0 6px}
.cartoes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
.cartao{background:var(--card);border-radius:18px;padding:14px 10px;text-align:center;box-shadow:var(--sombra)}
.cartao small{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--suave)}
.cartao b{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:26px;margin-top:2px}
.resumo{margin:0 0 22px;background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:var(--sombra)}
.resumo h3{font-size:19px;margin:0 0 10px}
.resumo ul{margin:0;padding-left:20px;display:grid;gap:7px}
.resumo li{color:var(--tinta-2);line-height:1.55}
.resumo li::marker{color:var(--marca)}
.resultado-acoes{display:grid;gap:12px}
.caixa-fim{background:var(--card);border-radius:20px;padding:16px 18px;margin-bottom:20px;box-shadow:var(--sombra)}
.caixa-fim h3{margin:0 0 8px;font-size:19px}
.caixa-fim p,.caixa-fim li{color:var(--tinta-2);line-height:1.6}
.caixa-fim code{background:var(--marca-claro);padding:1px 6px;border-radius:6px;font-size:.88em;word-break:break-all}
.caixa-fim pre.cod{margin:10px 0}
.caixa-fim .btn{margin:6px 0 10px}
.aprendeu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 26px}
.aprendeu span{background:var(--card);font-size:13.5px;font-weight:500;padding:6px 12px;border-radius:99px;box-shadow:var(--sombra)}
.confete{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.confete span{position:absolute;top:-50px;font-size:24px;animation:cair 2.6s ease-in forwards}
@keyframes cair{to{transform:translateY(115vh) rotate(540deg)}}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:var(--sombra-forte)}

/* janela de resumo */
.modal-fundo{position:fixed;inset:0;background:rgba(43,36,64,.42);display:grid;place-items:center;padding:16px;z-index:30;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--fundo);border-radius:26px;box-shadow:var(--sombra-forte);max-width:660px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:24px;position:relative}
.modal-fechar{position:absolute;top:14px;right:14px;width:34px;height:34px;border:0;border-radius:50%;background:var(--card);font-weight:700;box-shadow:var(--sombra)}
.modal .resumo{margin:12px 0 8px}
.teoria-cartao{border-bottom:1px solid var(--linha);padding:6px 0 10px}
.teoria-cartao:last-of-type{border-bottom:0}
.teoria-cartao h3{margin:12px 0 4px;font-size:18px}
.teoria-cartao p,.teoria-cartao li{line-height:1.65;color:var(--tinta-2);font-size:15.5px}
.teoria-cartao code{background:var(--marca-claro);padding:1px 6px;border-radius:6px;font-size:.88em}
.teoria-cartao pre.cod{margin:8px 0 6px}
.modal .btn.largo{margin-top:10px}

.aviso{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:25;background:var(--sol-claro);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--sombra-forte)}
.aviso code{background:var(--card);padding:1px 6px;border-radius:6px;word-break:break-all}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding:28px 24px}
  .hero-arte{order:-1;padding-top:52px}
  .hero-arte .pers{width:96px;height:96px}
  .hero h1{font-size:34px}
  .lista{grid-template-columns:1fr}
}
@media (max-width:520px){
  .topo-in{padding:9px 14px}
  .marca{font-size:20px}
  .stat.dias{display:none}
  .home{padding:14px 12px 48px}
  .hero{padding:22px 18px 24px;border-radius:24px}
  .hero-arte .pers{width:82px;height:82px}
  .hero h1{font-size:29px}
  .hero p.sub{font-size:15.5px}
  .hero-acoes .btn{flex:1 1 100%}
  .ato-topo h2{font-size:21px}
  .arquivo pre{font-size:11px}
  .licao-topo-in{padding:9px 12px;gap:10px}
  .topo-btn span{display:none}
  .corpo-in{padding:18px 14px 32px}
  .corpo h2{font-size:22px}
  .pagina{padding:18px}
  .pagina-topo .pers{width:42px;height:42px}
  .rodape{padding:12px 14px}
  .rodape .btn{padding:12px 14px}
  .rodape-esq,.rodape-dir{width:100%}
  .rodape-esq .btn,.rodape-dir .btn{flex:1}
  .rodape-in > #principal{flex:1 1 100%}
  .uma-linha .rodape-esq{width:auto}
  .uma-linha .rodape-dir{width:auto;flex:1;flex-wrap:nowrap}
  .fb-ico .pers{width:44px;height:44px}
  .fb-acoes{width:100%}
  .fb-acoes .btn{flex:1}
  .revisao{flex-wrap:wrap}
  .revisao .btn{width:100%}
  .editor textarea{min-height:170px;font-size:13px}
  .editor-topo .atalhos{display:none}
  .recomecar{margin-left:auto}
  .cartoes{gap:8px}
  .cartao b{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/licoes.js"></script>
<script src="/app.js"></script>
</body>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jokenpy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#2FBF71;--verde-esc:#22975A;--verde-claro:#E4F7EC;
  --azul:#3B82F6;--azul-esc:#2563EB;--azul-claro:#E8F0FE;
  --vermelho:#EF4444;--vermelho-esc:#C53030;--vermelho-claro:#FDECEC;
  --ouro:#F5B82E;--ouro-esc:#CF9512;
  --cinza:#E5E7EB;--cinza-esc:#C9CDD3;
  --texto:#2B2F36;--suave:#7A808A;--fundo:#fff;
  --cod:#1E2230;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--texto);background:var(--fundo);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
/* sem ligaduras: quem está aprendendo precisa ver == e != como dois caracteres */
code,pre,textarea,.peca,.teclas button,.lacuna{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0}

/* botões "gordinhos" com sombra embaixo */
.btn{--cor:var(--verde);--sombra:var(--verde-esc);border:0;border-radius:14px;padding:13px 24px;font-weight:900;font-size:16px;color:#fff;background:var(--cor);box-shadow:0 4px 0 var(--sombra);transition:filter .1s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn:disabled{--cor:var(--cinza);--sombra:var(--cinza-esc);color:#A6ABB3;cursor:default;filter:none;transform:none;box-shadow:0 4px 0 var(--sombra)}
.btn.vermelho{--cor:var(--vermelho);--sombra:var(--vermelho-esc)}
.btn.branco{--cor:#fff;--sombra:var(--cinza);color:var(--suave);border:2px solid var(--cinza)}
.btn.largo{width:100%}
.link{background:none;border:0;color:var(--suave);font-weight:800;text-decoration:underline;display:block;margin:28px auto 0}

/* topo */
.topo{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--cinza)}
.topo-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.marca{font-weight:900;font-size:22px;color:var(--verde);letter-spacing:-.01em}
.stats{display:flex;gap:16px;font-weight:900;align-items:center}
.fogo{color:#F97316}.raio{color:var(--ouro-esc)}
.som{background:none;border:0;font-size:18px;padding:4px}

/* trilha */
.home{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.unidade{background:var(--verde);color:#fff;border-radius:18px;padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;box-shadow:0 5px 0 var(--verde-esc)}
.unidade small{font-weight:800;opacity:.9;font-size:13px}
.unidade h1{margin:4px 0 6px;font-size:22px;font-weight:900;line-height:1.2}
.unidade p{margin:0;opacity:.95;font-weight:700;font-size:14px;line-height:1.4}
.unidade-ico{font-size:46px}
.trilha{display:flex;flex-direction:column;align-items:center;gap:48px;padding:56px 0 8px}
.no-linha{position:relative;transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center}
.no{width:74px;height:74px;border-radius:50%;border:0;font-size:30px;display:grid;place-items:center;background:var(--verde);box-shadow:0 6px 0 var(--verde-esc)}
.no:active{transform:translateY(6px);box-shadow:none}
.no.feito{background:var(--ouro);box-shadow:0 6px 0 var(--ouro-esc)}
.no.bloqueado{background:var(--cinza);box-shadow:0 6px 0 var(--cinza-esc);filter:grayscale(1)}
.no.atual{outline:7px solid var(--verde-claro);outline-offset:3px}
.no.final{width:88px;height:88px;font-size:38px}
.no-rotulo{margin-top:12px;font-weight:800;font-size:13px;color:var(--suave);text-align:center;max-width:150px}
.no-linha .feito + .no-rotulo{color:var(--ouro-esc)}
.no-sub{font-weight:700;font-size:12px;color:var(--suave);margin-top:2px}
.balao{position:absolute;top:-46px;background:#fff;border:2px solid var(--cinza);color:var(--verde);font-weight:900;font-size:14px;padding:6px 12px;border-radius:12px;animation:pulo 1.2s ease-in-out infinite;white-space:nowrap}
.balao::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;width:12px;height:12px;background:#fff;border-right:2px solid var(--cinza);border-bottom:2px solid var(--cinza);transform:rotate(45deg)}
@keyframes pulo{50%{transform:translateY(-6px)}}
.tremer{animation:tremer .3s}
@keyframes tremer{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* lição */
.licao{display:flex;flex-direction:column;height:100vh;height:100dvh}
.licao-topo{display:flex;align-items:center;gap:16px;padding:16px 20px;max-width:760px;width:100%;margin:0 auto}
.fechar{background:none;border:0;font-size:22px;color:var(--suave);font-weight:900;padding:4px}
.barra{flex:1;height:16px;background:var(--cinza);border-radius:99px;overflow:hidden}
.barra div{height:100%;background:var(--verde);border-radius:99px;transition:width .4s;position:relative}
.barra div::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.vidas{font-weight:900;color:var(--vermelho);white-space:nowrap;font-size:17px}
.corpo{flex:1;overflow-y:auto;width:100%}
.corpo-in{max-width:680px;margin:0 auto;padding:12px 20px 32px}
.entrar{animation:entrar .25s ease-out}
@keyframes entrar{from{opacity:0;transform:translateX(24px)}}
.corpo h2{font-size:22px;font-weight:900;margin:8px 0 18px;line-height:1.3}
.corpo h2 code,.enunciado code,.fb code,.bolha code{background:#F1F3F6;padding:1px 6px;border-radius:6px;font-size:.88em;font-weight:600}
.rodape{border-top:2px solid var(--cinza);padding:18px 20px}
.rodape-in{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rodape.certo{background:var(--verde-claro);border-color:transparent}
.rodape.errado{background:var(--vermelho-claro);border-color:transparent}
.fb{display:flex;gap:14px;align-items:flex-start;flex:1;min-width:240px}
.fb-ico{width:44px;height:44px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}
.certo .fb-ico,.certo h3{color:var(--verde-esc)}
.errado .fb-ico,.errado h3{color:var(--vermelho-esc)}
.fb h3{margin:0 0 4px;font-size:20px;font-weight:900}
.fb p{margin:0;font-weight:700;line-height:1.45;font-size:15px}
.fb p small{opacity:.8}
.certo .fb p{color:#1F6B42}.errado .fb p{color:#8E2A2A}
.fb code{background:rgba(255,255,255,.7)}
.fb-acoes{display:flex;gap:10px;align-items:center;margin-left:auto}

/* código */
pre.cod{background:var(--cod);color:#E6E8EE;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.65;overflow-x:auto;margin:0 0 16px;white-space:pre}
pre.saida-ex{background:#F6F7F9;color:var(--texto);border:2px dashed var(--cinza)}
.t-k{color:#F7A8FF}.t-s{color:#B5E48C}.t-c{color:#7D8597;font-style:italic}.t-n{color:#FFD166}.t-f{color:#7CC4FF}

/* dica */
.dica{display:flex;gap:14px;align-items:flex-start}
.mascote{font-size:56px;line-height:1;flex:none;animation:pulo 2s ease-in-out infinite}
.bolha{border:2px solid var(--cinza);border-radius:18px;padding:16px 18px;flex:1;min-width:0}
.bolha small{color:var(--verde);font-weight:900;font-size:13px}
.bolha h2{margin:4px 0 8px}
.bolha p,.bolha li{line-height:1.6;font-weight:700;color:#4A505A}
.bolha ol{padding-left:22px}
.rotulo{font-size:13px;font-weight:900;color:var(--suave);margin:14px 0 6px}

/* escolha */
.opcoes{display:grid;gap:12px}
.opcao{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid var(--cinza);border-bottom-width:4px;border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px;color:var(--texto)}
.opcao:hover{background:#F7F8FA}
.opcao .num{width:28px;height:28px;flex:none;border:2px solid var(--cinza);border-radius:8px;display:grid;place-items:center;font-size:13px;color:var(--suave)}
.opcao.sel{border-color:#93B8F8;background:var(--azul-claro);color:var(--azul-esc)}
.opcao.sel .num{border-color:#93B8F8;color:var(--azul-esc)}
.opcao.ok{border-color:#8FDCB0;background:var(--verde-claro);color:var(--verde-esc)}
.opcao.ruim{border-color:#F5A3A3;background:var(--vermelho-claro);color:var(--vermelho-esc)}
.opcao code{font-size:15px}
.travado{pointer-events:none}

/* completar */
.lacuna{background:#2C3247;border:0;border-bottom:2px solid #7CC4FF;color:#fff;font:inherit;padding:0 4px;border-radius:4px 4px 0 0;outline:none;text-align:center}
.lacuna:focus{background:#39415C}
.lacuna.ok{border-color:#B5E48C;color:#B5E48C}
.lacuna.ruim{border-color:#FF8A8A;color:#FF8A8A}

/* montar */
.montagem{min-height:66px;border-top:2px solid var(--cinza);border-bottom:2px solid var(--cinza);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;align-content:flex-start}
.banco{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.peca{background:#fff;border:2px solid var(--cinza);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--texto);font-weight:600}
.peca:active{transform:translateY(2px)}
.peca.usada{background:var(--cinza);color:transparent;pointer-events:none}

/* editor */
.enunciado{font-weight:700;line-height:1.55;margin:-8px 0 14px;color:#4A505A}
.chips{margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--azul-claro);color:var(--azul-esc);font-weight:800;font-size:13px;padding:4px 10px;border-radius:99px}
.editor{border-radius:14px;overflow:hidden;background:var(--cod);margin-bottom:14px}
.editor-topo{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#161925;color:#9AA3B5;font-size:12px;font-weight:800}
.editor-topo .atalhos{margin-left:auto}
.recomecar{background:none;border:1px solid #3A4157;border-radius:8px;color:#C9D1E0;font-size:12px;font-weight:800;padding:3px 8px}
.recomecar:hover{background:#2C3247}
.editor textarea{display:block;width:100%;min-height:230px;resize:vertical;border:0;outline:none;background:transparent;color:#E6E8EE;font-size:14px;line-height:1.65;padding:12px 16px;tab-size:4;white-space:pre;overflow:auto}
.saida{border:2px solid var(--cinza);border-radius:14px;overflow:hidden}
.saida-topo{background:#F6F7F9;padding:6px 14px;font-size:13px;font-weight:900;color:var(--suave)}
.saida pre{margin:0;padding:12px 14px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;max-height:240px;overflow:auto}
.saida .err{color:var(--vermelho-esc);font-weight:600}
.saida .vazio{color:var(--suave)}

/* ferramentas: dica, completar, ver resposta */
.ferramentas{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 14px}
.ferr{background:#fff;border:2px solid var(--cinza);border-bottom-width:4px;border-radius:12px;padding:7px 12px;font-weight:800;font-size:14px;color:var(--texto)}
.ferr:hover{background:#F7F8FA}
.ferr.ativo{border-color:#93B8F8;background:var(--azul-claro);color:var(--azul-esc)}
.btn.mini{padding:8px 14px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--sombra)}
.ia{display:flex;gap:12px;align-items:flex-start;background:#F4F0FF;border:2px solid #DCD0FF;border-radius:14px;padding:12px 14px;margin:0 0 14px}
.ia-ico{font-size:28px;line-height:1}
.ia-texto{font-weight:700;line-height:1.55;color:#3B2F66;white-space:pre-wrap;min-width:0;flex:1}
.ia-texto small,.sugestao small,.previa small{display:block;font-weight:900;font-size:13px;margin-bottom:4px}
.ia-texto small{color:#7C6BB5}
.ia-texto code{background:#fff;padding:1px 6px;border-radius:6px;font-size:.9em;font-weight:600}
.ia-texto pre.cod{margin:8px 0 4px;white-space:pre}
.ia-erro{color:var(--vermelho-esc)}
.pensando::after{content:"…";animation:piscar 1s infinite}
@keyframes piscar{50%{opacity:.2}}
.sugestao{border:2px dashed #93B8F8;background:var(--azul-claro);border-radius:14px;padding:10px 12px;margin:0 0 14px}
.sugestao small{color:var(--azul-esc)}
.sugestao pre.cod{margin:6px 0 10px}
.sugestao-acoes{display:flex;gap:8px;flex-wrap:wrap}
.previa{border:2px solid var(--cinza);border-radius:14px;padding:10px 12px;margin:0 0 14px}
.previa-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.previa small{color:var(--suave);margin:0}
.previa pre.cod{margin:0}

/* resultado */
.resultado{max-width:540px;margin:0 auto;padding:48px 20px;text-align:center}
.trofeu{font-size:90px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.resultado h1{font-size:30px;font-weight:900;color:var(--ouro-esc);margin:8px 0}
.resultado > p{font-weight:700;color:var(--suave)}
.cartoes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0}
.cartao{border-radius:14px;background:var(--c);padding:2px}
.cartao small{display:block;color:#fff;font-weight:900;font-size:13px;padding:5px 2px 6px}
.resultado .btn.branco{margin-top:14px}
.cartao b{display:block;background:#fff;border-radius:12px;padding:14px 4px;font-size:20px;color:var(--c)}
.caixa-fim{text-align:left;border:2px solid var(--cinza);border-radius:16px;padding:16px 18px;margin-bottom:22px}
.caixa-fim h3{margin:0 0 8px;font-size:18px;font-weight:900}
.caixa-fim p,.caixa-fim li{font-weight:700;color:#4A505A;line-height:1.55}
.caixa-fim code{background:#F1F3F6;padding:1px 6px;border-radius:6px;font-size:.88em;word-break:break-all}
.caixa-fim pre.cod{margin:10px 0}
.aprendeu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 26px}
.aprendeu span{background:var(--verde-claro);color:var(--verde-esc);font-weight:800;font-size:13px;padding:6px 12px;border-radius:99px}
.confete{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.confete span{position:absolute;top:-50px;font-size:24px;animation:cair 2.8s ease-in forwards}
@keyframes cair{to{transform:translateY(115vh) rotate(540deg)}}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:var(--texto);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:20;max-width:calc(100% - 32px)}

/* acessibilidade: foco visível no teclado */
:focus-visible{outline:3px solid #93B8F8;outline-offset:2px}

/* painéis da tela inicial */
.painel{border:2px solid var(--cinza);border-radius:16px;padding:14px 16px;margin-top:14px}
.retomar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-color:#BDEBCF;background:var(--verde-claro)}
.retomar small,.meta small{display:block;font-weight:800;font-size:13px;color:var(--suave)}
.retomar b{display:block;font-size:17px;font-weight:900;margin:2px 0}
.retomar span{font-weight:700;color:#4A505A;font-size:14px}
.meta-topo{display:flex;justify-content:space-between;font-weight:900;margin-bottom:8px}
.meta-topo span{color:var(--ouro-esc)}
.meta small{margin-top:8px}
.barra.fina{height:12px}
.barra.ouro div{background:var(--ouro)}
.resumo-meta{font-weight:800;color:var(--suave);margin-top:-12px}

/* cartão da lição (abre ao clicar no círculo) */
.no-linha.aberta{z-index:6}
.no.livre{background:var(--verde)}
.cartao-licao{position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(calc(-50% - var(--x)));width:min(300px,calc(100vw - 32px));z-index:6;background:var(--verde);color:#fff;border-radius:16px;padding:14px 16px 16px;box-shadow:0 5px 0 var(--verde-esc);text-align:left;animation:surgir .16s ease-out}
@keyframes surgir{from{opacity:0;margin-top:-8px}}
.cartao-licao::before{content:"";position:absolute;top:-7px;left:calc(50% + var(--x) - 8px);width:16px;height:16px;background:inherit;transform:rotate(45deg);border-radius:3px}
.cartao-licao.ouro{background:var(--ouro);box-shadow:0 5px 0 var(--ouro-esc)}
.cartao-licao.bloq{background:#fff;color:var(--texto);border:2px solid var(--cinza);box-shadow:0 5px 0 var(--cinza)}
.cartao-licao.bloq::before{border-left:2px solid var(--cinza);border-top:2px solid var(--cinza);top:-9px}
.cartao-licao small{font-weight:800;opacity:.9;font-size:13px}
.cartao-licao h3{margin:2px 0 6px;font-size:19px;font-weight:900}
.cartao-licao p{margin:0 0 12px;font-weight:700;line-height:1.45}
.cartao-licao.bloq p{margin:0;color:var(--suave)}
.cartao-licao .btn{--cor:#fff;--sombra:rgba(0,0,0,.18);color:var(--verde-esc)}
.cartao-licao.ouro .btn{color:var(--ouro-esc)}
.cartao-licao .btn.branco{--cor:transparent;--sombra:transparent;color:#fff;border:2px solid rgba(255,255,255,.7);margin-top:10px}

/* lição */
.topo-btn{background:#fff;border:2px solid var(--cinza);border-radius:12px;padding:5px 10px;font-weight:800;color:var(--suave);white-space:nowrap}
.topo-btn:hover{background:#F7F8FA}
.montagem-vazia{color:#A6ABB3;font-weight:700;align-self:center}
.ajuda-montar{text-align:center;color:var(--suave);font-weight:700;font-size:14px;margin-top:22px}
.chip.verde{background:var(--verde-claro);color:var(--verde-esc)}

/* ensino: cartões de explicação antes dos exercícios */
.barra.azul div{background:var(--azul)}
.ensino-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.etiqueta{display:inline-block;background:var(--azul-claro);color:var(--azul-esc);font-weight:900;font-size:13px;padding:5px 12px;border-radius:99px}
.pontos{display:flex;gap:6px}
.pontos i{width:10px;height:10px;border-radius:50%;background:var(--cinza)}
.pontos i.visto{background:#93B8F8}
.pontos i.agora{background:var(--azul);width:24px;border-radius:99px}
.editor.mini{margin-bottom:10px}
.editor.mini textarea{min-height:0;resize:vertical}
.btn.azul{--cor:var(--azul);--sombra:var(--azul-esc)}
#ex-saida{margin-top:12px}

/* rodapé com grupo de botões à esquerda */
.rodape-esq,.rodape-dir{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rodape-dir{margin-left:auto}

/* teoria completa na janela */
.modal .etiqueta{margin-bottom:6px}
.teoria-cartao{border-bottom:2px solid var(--cinza);padding:6px 0 10px}
.teoria-cartao:last-of-type{border-bottom:0}
.teoria-cartao h3{margin:10px 0 4px;font-size:18px;font-weight:900}
.teoria-cartao p,.teoria-cartao li{line-height:1.6;font-weight:700;color:#4A505A}
.teoria-cartao code{background:#F1F3F6;padding:1px 6px;border-radius:6px;font-size:.88em;font-weight:600}
.teoria-cartao pre.cod{margin:8px 0 6px}

/* janela da teoria */
.modal-fundo{position:fixed;inset:0;background:rgba(20,22,30,.45);display:grid;place-items:center;padding:16px;z-index:30;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:20px;position:relative}
.modal-fechar{position:absolute;top:10px;right:12px;background:none;border:0;font-size:20px;color:var(--suave);font-weight:900}
.modal .mascote{display:none}
.modal .bolha{border:0;padding:0}
.modal .btn{margin-top:8px}

/* aviso de servidor desligado */
.aviso{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:25;background:#FFF4E5;color:#8A4B00;border:2px solid #FFD8A8;border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;width:max-content;max-width:calc(100% - 32px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.aviso code{background:#fff;padding:1px 6px;border-radius:6px;word-break:break-all}

/* erro do Python explicado */
.entender{border-top:2px solid var(--cinza);background:#FFFBEB;padding:10px 14px;font-weight:700;font-size:14px;line-height:1.55;color:#6B4E00}
.entender:empty{display:none}
.entender b{display:block;color:#8A6100;font-size:13px;margin-bottom:2px}
.entender code{background:#fff;padding:1px 6px;border-radius:6px;font-size:.9em}

/* teclas de código no celular (o teclado do celular não tem Tab nem símbolos à mão) */
.teclas{display:flex;gap:6px;overflow-x:auto;margin:-6px 0 14px;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.teclas button{flex:none;min-width:40px;height:40px;border:2px solid var(--cinza);border-bottom-width:4px;border-radius:10px;background:#fff;font-family:'JetBrains Mono',monospace;font-weight:600;font-size:16px;color:var(--texto);padding:0 10px}
.teclas button:active{transform:translateY(2px)}

/* painel de revisão na trilha */
.revisao{display:flex;align-items:center;justify-content:space-between;gap:12px;border-color:#C7DAFB;background:var(--azul-claro)}
.revisao b{display:block;font-size:17px;font-weight:900;margin-bottom:2px;color:var(--azul-esc)}
.revisao span{font-weight:700;color:#4A505A;font-size:14px}

@media (max-width:520px){
  .rodape-in > #principal{flex:1 1 100%}
  .fb-acoes{width:100%;flex-wrap:wrap}
  .fb-acoes .btn{flex:1}
  .revisao{flex-wrap:wrap}
  .revisao .btn{width:100%}
  .editor textarea{min-height:180px;font-size:13px}
  .topo-btn span{display:none}
  .rodape .btn{padding:12px 16px;font-size:15px}
  .rodape-esq{width:100%}
  .rodape-esq .btn{flex:1}
  .rodape-dir{width:100%}
  .rodape-dir .btn{flex:1}
  .retomar{flex-wrap:wrap}
  .mascote{display:none}
  .corpo h2{font-size:20px}
  .cartao b{font-size:17px}
  .editor-topo .atalhos{display:none}
  .recomecar{margin-left:auto}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="/licoes.js"></script>
<script src="/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Estude programação todo dia: Python, Java + Spring Boot, React, Django e SQL em lições curtas, com exercícios corrigidos na hora.">
<title>Jokenpy · estude programação todo dia</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icones/icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icones/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jokenpy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Jokenpy: um app de estudo diário. Cada trilha tem a sua cor (--acao), que tinge o app inteiro;
   os três personagens (Pedra coral, Papel azul, Tesoura menta) guiam as partes de cada trilha.
   Tema claro e escuro; tudo pensado primeiro para o celular. */
:root{
  --acao:#5B5BF0;
  --acao-esc:color-mix(in srgb,var(--acao) 76%,#000);
  --acao-claro:color-mix(in srgb,var(--acao) 11%,var(--card));
  --acao-txt:color-mix(in srgb,var(--acao) 82%,var(--texto));
  --fundo:#F5F4FA;--fundo-2:#ECEBF4;--card:#FFFFFF;--card-2:#F3F2F9;--linha:#E6E4F0;--linha-2:#D5D2E3;
  --texto:#18162A;--texto-2:#4A4762;--suave:#85829E;
  --sol:#FFB020;--sol-esc:#D98E00;--fogo:#FF7A1A;
  --pedra:#FF6B5B;--papel:#4A9DFF;--tesoura:#1FC58F;
  --ok:#16B67E;--ok-esc:#0E9466;--ok-fundo:color-mix(in srgb,var(--ok) 13%,var(--card));
  --erro:#F04B5D;--erro-esc:#C9334A;--erro-fundo:color-mix(in srgb,var(--erro) 11%,var(--card));
  --aviso-fundo:#FFF6DD;--aviso-txt:#5C4500;--aviso-forte:#9A6B00;
  --cod:#1C1A2E;--cod-2:#2A2742;--cod-txt:#EEEBFF;--cod-suave:#8C84BF;
  --raio:20px;--sombra:0 1px 2px rgba(24,22,42,.05),0 8px 24px rgba(24,22,42,.07);
  --abas-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-tema=claro]){
  --fundo:#0F0E18;--fundo-2:#17152A;--card:#1A1829;--card-2:#232136;--linha:#2C2A42;--linha-2:#3A3753;
  --texto:#F1EFFA;--texto-2:#C3C0D9;--suave:#8D89A8;
  --acao-claro:color-mix(in srgb,var(--acao) 20%,var(--card));
  --acao-txt:color-mix(in srgb,var(--acao) 55%,#fff);
  --ok-fundo:color-mix(in srgb,var(--ok) 18%,var(--card));--erro-fundo:color-mix(in srgb,var(--erro) 17%,var(--card));
  --aviso-fundo:#2C2412;--aviso-txt:#F3DFA8;--aviso-forte:#FFC94D;
  --cod:#13111F;--cod-2:#1F1C31;--sombra:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-tema=escuro]{
  --fundo:#0F0E18;--fundo-2:#17152A;--card:#1A1829;--card-2:#232136;--linha:#2C2A42;--linha-2:#3A3753;
  --texto:#F1EFFA;--texto-2:#C3C0D9;--suave:#8D89A8;
  --acao-claro:color-mix(in srgb,var(--acao) 20%,var(--card));
  --acao-txt:color-mix(in srgb,var(--acao) 55%,#fff);
  --ok-fundo:color-mix(in srgb,var(--ok) 18%,var(--card));--erro-fundo:color-mix(in srgb,var(--erro) 17%,var(--card));
  --aviso-fundo:#2C2412;--aviso-txt:#F3DFA8;--aviso-forte:#FFC94D;
  --cod:#13111F;--cod-2:#1F1C31;--sombra:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
.cor-pedra{--cor:var(--pedra)}.cor-papel{--cor:var(--papel)}.cor-tesoura{--cor:var(--tesoura)}
[class*=cor-]{--cor-esc:color-mix(in srgb,var(--cor) 78%,#000);--cor-claro:color-mix(in srgb,var(--cor) 13%,var(--card));--cor-txt:color-mix(in srgb,var(--cor) 70%,var(--texto))}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:var(--texto);background:var(--fundo);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh}
h1,h2,h3{font-weight:800;letter-spacing:-.012em}
button{font:inherit;cursor:pointer;color:inherit}
input{font:inherit;color:inherit}
/* sem ligaduras: quem está aprendendo precisa ver == e != como dois caracteres */
code,pre,textarea,.peca,.teclas button,.lacuna{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acao) 55%,#fff);outline-offset:3px}
.ic{display:inline-block;flex:none;vertical-align:-.2em}

/* botões com leve relevo, que afundam ao tocar */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:13px 20px;font-weight:800;font-size:15.5px;letter-spacing:-.005em;
  color:#fff;background:var(--acao);box-shadow:0 4px 0 var(--acao-esc);transition:transform .06s,filter .1s;text-decoration:none}
.btn .ic{width:19px;height:19px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--acao-esc)}
.btn:disabled{background:var(--linha);color:var(--suave);box-shadow:0 4px 0 var(--linha-2);cursor:default;filter:none;transform:none}
.btn.branco{background:var(--card);color:var(--texto-2);box-shadow:0 4px 0 var(--linha),inset 0 0 0 2px var(--linha)}
.btn.branco:active{box-shadow:inset 0 0 0 2px var(--linha)}
.btn.azul{background:var(--papel);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--papel) 75%,#000)}
.btn.vermelho{background:var(--erro);color:#fff;box-shadow:0 4px 0 var(--erro-esc)}
.btn.verde{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-esc)}
.btn.largo{width:100%}
.btn.grande{padding:16px 24px;font-size:17px;border-radius:18px}
.btn.mini{padding:8px 14px;font-size:13.5px;border-radius:12px;box-shadow:0 3px 0 var(--acao-esc)}
.btn.branco.mini{box-shadow:0 3px 0 var(--linha),inset 0 0 0 2px var(--linha)}
.link{background:none;border:0;color:var(--suave);font-weight:600;text-decoration:underline;text-underline-offset:3px;display:block;margin:28px auto 0;font-size:14px}
.kicker{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--acao-txt)}
.nota{color:var(--texto-2);font-size:14.5px;line-height:1.6;margin:8px 0 12px}
.nota .ic{width:17px;height:17px;color:var(--acao-txt)}

/* personagens */
.pers{display:block;flex:none;overflow:visible}
.flutua{animation:flutua 2.8s ease-in-out infinite}
@keyframes flutua{50%{transform:translateY(-8px) rotate(-3deg)}}
.pula{animation:pula .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pula{from{transform:scale(.5) rotate(-10deg)}}
.balanca{animation:balanca .5s ease-in-out}
@keyframes balanca{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}

/* ---------- casca: topo e abas ---------- */
.topo{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--fundo) 86%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid color-mix(in srgb,var(--linha) 70%,transparent);padding-top:env(safe-area-inset-top)}
.topo-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;padding:10px 20px;gap:16px}
.marca{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;font-weight:800;font-size:20px;letter-spacing:-.03em;color:var(--texto)}
.marca b{color:var(--acao-txt)}
.marca-trio{display:flex}.marca-trio .pers{margin-right:-6px}
.stats{display:flex;gap:6px;align-items:center;margin-left:auto}
.stat{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:12px;font-weight:800;font-size:15px;background:var(--card);border:1px solid var(--linha)}
.stat .ic{width:18px;height:18px}
.stat.fogo{color:var(--suave)}.stat.fogo.aceso{color:var(--fogo)}.stat.fogo.risco{color:var(--fogo);animation:pulso 2s ease-in-out infinite}
@keyframes pulso{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--fogo) 22%,transparent)}}
.stat.raio{color:var(--sol-esc)}
.abas{display:flex;gap:4px}
.aba{display:flex;align-items:center;gap:7px;background:none;border:0;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14.5px;color:var(--suave)}
.aba:hover{background:var(--card-2);color:var(--texto-2)}
.aba.ativa{color:var(--acao-txt);background:var(--acao-claro)}
.abas-baixo{display:none}

.tela{max-width:1080px;margin:0 auto;padding:22px 20px 60px}
.tela.hoje,.tela.perfil,.tela.trilhas-tela{max-width:720px}
.saudacao{margin:4px 0 18px}
.saudacao .kicker{color:var(--suave)}
.saudacao h1{font-size:29px;line-height:1.18;margin:6px 0 0}
.saudacao p{color:var(--texto-2);margin:8px 0 0}
.bloco{margin-top:26px}
.bloco > h3{font-size:18px;margin:0 0 10px}
.cartao-bloco{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:18px;box-shadow:var(--sombra)}
.cartao-bloco h3{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:18px}
.cartao-bloco h3.sub{margin-top:20px}
.cartao-bloco h3 .ic{color:var(--acao-txt)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dupla .btn.largo{grid-column:1/-1}

/* ---------- Hoje ---------- */
.painel-dia{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:16px 18px;box-shadow:var(--sombra);margin-bottom:16px}
.anel{--p:0;width:86px;height:86px;flex:none;border-radius:50%;background:conic-gradient(var(--sol) calc(var(--p)*1%),var(--linha) 0);display:grid;place-items:center;transition:--p .6s}
.anel span{width:68px;height:68px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.anel b{font-size:22px;font-weight:800}
.anel small{font-size:11px;font-weight:700;color:var(--suave);margin-top:2px}
.bateu .anel{background:conic-gradient(var(--ok) 100%,var(--ok) 0)}
.painel-dia-txt{flex:1;min-width:0}
.painel-linha{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.fogo-txt{display:inline-flex;align-items:center;gap:5px;font-size:17px;color:var(--texto)}
.fogo-txt .ic{color:var(--suave);width:21px;height:21px}.fogo-txt.aceso .ic{color:var(--fogo)}
.protetor{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:14px;color:var(--papel);background:color-mix(in srgb,var(--papel) 12%,var(--card));border-radius:10px;padding:3px 8px}
.protetor .ic{width:16px;height:16px}
.semana{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.semana li{display:flex;flex-direction:column;align-items:center;gap:4px}
.semana span{font-size:11.5px;font-weight:700;color:var(--suave)}
.semana i{width:100%;max-width:34px;aspect-ratio:1;border-radius:10px;background:var(--card-2);border:2px solid var(--linha);display:grid;place-items:center;color:#fff}
.semana i .ic{width:15px;height:15px}
.semana .fez i{background:var(--fogo);border-color:var(--fogo)}
.semana .prot i{background:color-mix(in srgb,var(--papel) 18%,var(--card));border-color:var(--papel);color:var(--papel)}
.semana .hoje span{color:var(--texto)}
.semana .hoje:not(.fez) i{border-style:dashed;border-color:var(--fogo)}

.heroi{--cor-t:var(--acao);position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 22px;color:#fff;margin-bottom:16px;
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--cor-t) 55%,#fff) 0%,transparent 55%),linear-gradient(150deg,var(--cor-t),color-mix(in srgb,var(--cor-t) 62%,#000));
  box-shadow:0 14px 34px color-mix(in srgb,var(--cor-t) 35%,transparent)}
.heroi::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.2px,transparent 1.3px);background-size:18px 18px;mask-image:linear-gradient(200deg,#000,transparent 65%);pointer-events:none}
.heroi > *{position:relative}
.heroi-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.heroi-trilha{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:99px;padding:5px 12px;font-weight:700;font-size:13.5px}
.heroi-tempo{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13.5px;opacity:.92}
.heroi-tempo .ic{width:16px;height:16px}
.heroi-rotulo{display:block;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.heroi h2{font-size:27px;line-height:1.15;margin:6px 0 8px;max-width:calc(100% - 96px)}
.heroi p{margin:0 0 16px;opacity:.94;line-height:1.5;max-width:calc(100% - 70px);font-size:15.5px}
.heroi-prog{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.heroi-prog small{font-size:12.5px;font-weight:700;opacity:.9;white-space:nowrap}
.heroi .barra-fina{background:rgba(255,255,255,.25)}.heroi .barra-fina i{background:#fff}
.heroi-guia{position:absolute;right:14px;top:58px}
.heroi .btn.branco-solido,.btn.branco-solido{background:#fff;color:color-mix(in srgb,var(--cor-t,var(--acao)) 80%,#000);box-shadow:0 4px 0 rgba(0,0,0,.22)}
.heroi .btn.branco-solido:active{box-shadow:0 0 0 transparent}
.barra-fina{flex:1;display:block;height:8px;border-radius:99px;background:var(--linha);overflow:hidden}
.barra-fina i{display:block;height:100%;border-radius:99px;background:var(--cor-t,var(--acao));transition:width .5s}

.grade-cartoes{display:grid;gap:12px}
.cartao-acao{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:14px 16px;box-shadow:var(--sombra);color:var(--texto)}
button.cartao-acao:active{transform:scale(.99)}
.cartao-acao > span:nth-child(2){flex:1;min-width:0}
.cartao-acao b{display:block;font-size:16px}
.cartao-acao small{display:block;color:var(--texto-2);font-size:13.5px;line-height:1.4;margin-top:1px}
.cartao-acao > .ic{color:var(--suave)}
.ca-ico{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center}
.ca-ico.azul{background:color-mix(in srgb,var(--papel) 15%,var(--card));color:var(--papel)}
.ca-ico.sol{background:color-mix(in srgb,var(--sol) 18%,var(--card));color:var(--sol-esc)}
.ca-ico.verde{background:color-mix(in srgb,var(--tesoura) 16%,var(--card));color:var(--ok-esc)}
.ca-botoes{display:flex;align-items:center;gap:4px}
.dispensar{background:none;border:0;color:var(--suave);font-size:15px;padding:6px 8px;border-radius:8px}
.sugestao-trilha{--cor-t:var(--acao);display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:16px;border-radius:20px;padding:16px;
  background:color-mix(in srgb,var(--cor-t) 10%,var(--card));border:2px solid color-mix(in srgb,var(--cor-t) 40%,var(--linha));color:var(--texto)}
.sugestao-trilha > span:nth-child(2){flex:1}
.sugestao-trilha small{display:block;font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;color:color-mix(in srgb,var(--cor-t) 75%,var(--texto))}
.sugestao-trilha b{display:block;font-size:18px}
.sugestao-trilha span span{color:var(--texto-2);font-size:14px}
.st-ico{font-size:34px}
.mini-trilhas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mini-trilha{--cor-t:var(--acao);display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 10px;text-align:left;background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:12px 14px;color:var(--texto)}
.mini-trilha > span:first-child{font-size:22px;grid-row:span 2}
.mini-trilha b{font-size:14.5px;line-height:1.2}
.mini-trilha .mt-barra{grid-column:1/-1;height:6px;border-radius:9px;background:var(--linha);overflow:hidden;margin-top:6px}
.mini-trilha .mt-barra i{display:block;height:100%;background:var(--cor-t)}
.mini-trilha small{grid-column:2;grid-row:2;color:var(--suave);font-weight:700;font-size:12px}

/* ---------- Trilhas ---------- */
.grade-trilhas{display:grid;gap:12px}
.card-trilha{--cor-t:var(--acao);display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:16px;box-shadow:var(--sombra);color:var(--texto);position:relative;overflow:hidden}
.card-trilha::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cor-t)}
.card-trilha.atual{border-color:color-mix(in srgb,var(--cor-t) 50%,var(--linha));background:color-mix(in srgb,var(--cor-t) 6%,var(--card))}
.card-trilha:active{transform:scale(.99)}
.ct-ico{width:56px;height:56px;flex:none;border-radius:18px;display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--cor-t) 14%,var(--card))}
.ct-txt{flex:1;min-width:0;display:block}
.ct-txt small{display:block;font-weight:700;font-size:12px;color:color-mix(in srgb,var(--cor-t) 72%,var(--texto));text-transform:uppercase;letter-spacing:.06em}
.ct-txt b{display:block;font-size:19px;margin:2px 0 2px;letter-spacing:-.02em}
.ct-txt > span{display:block;color:var(--texto-2);font-size:14.5px;line-height:1.4}
.ct-prog{display:flex !important;align-items:center;gap:10px;margin-top:12px}
.ct-prog small{text-transform:none;letter-spacing:0;color:var(--suave);font-size:12.5px;white-space:nowrap}

/* ---------- Você ---------- */
.numeros{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
.numeros > div{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:14px 10px;text-align:center;box-shadow:var(--sombra)}
.numeros b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:24px;font-weight:800;letter-spacing:-.03em}
.numeros b .ic{width:20px;height:20px}
.numeros > div:first-child .ic{color:var(--fogo)}.numeros > div:nth-child(3) .ic{color:var(--sol-esc)}
.numeros small{display:block;color:var(--suave);font-weight:600;font-size:12.5px;line-height:1.25;margin-top:2px}
.constancia{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin:12px 0 2px}
.constancia .col{display:grid;gap:5px}
.constancia i{display:block;aspect-ratio:1;border-radius:5px;background:var(--card-2);border:1px solid var(--linha)}
.constancia i.n1{background:color-mix(in srgb,var(--fogo) 30%,var(--card));border-color:transparent}
.constancia i.n2{background:color-mix(in srgb,var(--fogo) 55%,var(--card));border-color:transparent}
.constancia i.n3{background:color-mix(in srgb,var(--fogo) 80%,var(--card));border-color:transparent}
.constancia i.n4{background:var(--fogo);border-color:transparent}
.constancia i.prot{background:color-mix(in srgb,var(--papel) 40%,var(--card));border-color:transparent}
.constancia i.fut{opacity:.35;border-style:dashed}
.linha-ajuste{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linha)}
.linha-ajuste:first-of-type{border-top:0}
.linha-ajuste span,.linha-ajuste label{font-weight:600}
.linha-ajuste input[type=time]{font-size:18px;font-weight:800;padding:8px 12px;border-radius:12px;border:2px solid var(--linha-2);background:var(--fundo);color:var(--texto)}
.metas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.meta-op{background:var(--card);border:2px solid var(--linha);border-radius:16px;padding:12px 8px;text-align:center;color:var(--texto)}
.meta-op b{display:block;font-size:16px}
.meta-op span{display:block;font-weight:800;color:var(--sol-esc);font-size:14px}
.meta-op small{display:block;color:var(--suave);font-size:12px;line-height:1.3;margin-top:2px}
.meta-op.sel{border-color:var(--acao);background:var(--acao-claro);box-shadow:0 3px 0 var(--acao)}
.segmento{display:flex;background:var(--card-2);border-radius:12px;padding:3px;gap:2px}
.segmento button{border:0;background:none;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13.5px;color:var(--texto-2)}
.segmento button.sel{background:var(--card);color:var(--texto);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chave{width:52px;height:30px;border-radius:99px;border:0;background:var(--linha-2);position:relative;flex:none;transition:background .15s}
.chave i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.chave.ligada{background:var(--ok)}.chave.ligada i{transform:translateX(22px)}
.lembrete-msg{background:var(--ok-fundo);color:var(--ok-esc);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;margin:4px 0 12px}
.lembrete-msg.erro{background:var(--erro-fundo);color:var(--erro-esc)}
.arquivo-btn{cursor:pointer}
.passos{padding-left:22px;line-height:1.7;color:var(--texto-2)}
.passos b{color:var(--texto)}

/* ---------- uma trilha: o mapa ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:36px;align-items:start}
.lateral{position:sticky;top:82px;display:grid;gap:16px}
.voltar-trilhas{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--suave);font-weight:700;font-size:14.5px;margin-bottom:6px}
.voltar-trilhas .ic{width:18px;height:18px}
.boas-vindas{margin:0 0 24px}
.boas-vindas h1{font-size:28px;line-height:1.18;margin:6px 0 8px}
.boas-vindas h1 em{font-style:normal;color:var(--acao-txt)}
.boas-vindas p{color:var(--texto-2);margin:0;font-size:15.5px}
.mundo{margin-bottom:30px}
.mundo-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--cor-claro);color:var(--texto);border-radius:20px;padding:14px 18px;border-left:6px solid var(--cor)}
.mundo-banner small{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--cor-txt)}
.mundo-banner h2{margin:2px 0 0;font-size:22px;line-height:1.2}
.caminho{list-style:none;margin:0;padding:44px 0 6px;display:flex;flex-direction:column;align-items:center;gap:30px}
.item{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(var(--x))}
.item.atual{margin-top:30px}
.no{border:0;background:none;padding:0;position:relative}
.hex{display:grid;place-items:center;width:84px;height:78px;background:var(--card-2);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);
  filter:drop-shadow(0 5px 0 var(--linha-2));transition:transform .1s}
.no:active .hex{transform:translateY(5px)}
.no .ico{font-size:30px;line-height:1}
.no.feito .hex{background:var(--cor);filter:drop-shadow(0 5px 0 var(--cor-esc))}
.no.feito .ico{font-size:28px;font-weight:800;color:#fff}
.no.sugerida .hex{background:var(--cor);filter:drop-shadow(0 5px 0 var(--cor-esc));animation:brilho 2.2s ease-in-out infinite}
@keyframes brilho{50%{filter:drop-shadow(0 5px 0 var(--cor-esc)) drop-shadow(0 0 12px var(--cor))}}
.no:hover .hex{transform:translateY(-2px)}
.rotulo-no{margin-top:10px;text-align:center;max-width:170px}
.rotulo-no b{display:block;font-size:14px;line-height:1.25}
.rotulo-no small{display:block;color:var(--suave);font-size:12px;font-weight:600}
.estrelas{display:inline-flex;gap:2px;font-style:normal}
.estrelas i{font-style:normal;color:var(--linha-2);font-size:15px}
.estrelas i.acesa{color:var(--sol)}
.balao{position:absolute;top:-42px;background:var(--card);color:var(--acao-txt);border:2px solid var(--linha);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;padding:7px 12px;border-radius:12px;white-space:nowrap;animation:pulo 1.3s ease-in-out infinite;z-index:2}
.balao::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--linha);border-bottom:0}
@keyframes pulo{50%{transform:translateY(-5px)}}
.guia{position:absolute;left:calc(100% + 18px);top:4px}
.item.aberta{z-index:6}
.cartao-licao{position:absolute;top:calc(100% + 12px);left:50%;transform:translateX(calc(-50% - var(--x,0px)));width:min(310px,calc(100vw - 32px));z-index:6;background:var(--card);color:var(--texto);border-radius:18px;padding:14px 16px 16px;border:2px solid var(--cor);box-shadow:var(--sombra);animation:surgir .15s ease-out}
.cartao-licao h3{margin:0 0 4px;font-size:18px}
.cartao-licao p{margin:0 0 12px;font-size:14px;color:var(--texto-2)}
.cartao-licao p.porque{color:var(--texto);font-weight:600}
.cartao-licao .acoes{display:grid;gap:10px}
.cartao-licao .btn{background:var(--cor);color:#fff;box-shadow:0 4px 0 var(--cor-esc)}
.cartao-licao .btn.branco{background:var(--card);color:var(--texto-2);box-shadow:0 4px 0 var(--linha),inset 0 0 0 2px var(--linha)}
@keyframes surgir{from{opacity:0;margin-top:-6px}}
.cartao-lado{background:var(--card);border-radius:var(--raio);padding:16px 18px;border:2px solid var(--linha)}
.cartao-lado b{display:block;font-size:17px;font-weight:800}
.cartao-lado small{display:block;color:var(--suave);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.cartao-lado span{color:var(--texto-2);font-size:14px}
.continuar{border-color:var(--cor,var(--linha))}
.continuar b{margin:2px 0 4px;font-size:19px}
.continuar .btn{margin-top:12px}
.revisao{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.revisao > div{flex:1;min-width:140px}
.revisao .btn{width:100%}
.arquivo{border-radius:var(--raio);background:var(--cod);overflow:hidden}
.arquivo-topo{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--cod-2);color:#B9B4D6;font-family:'JetBrains Mono',monospace;font-size:12px}
.arquivo-topo .pers{margin-right:-4px}
.arquivo-topo span{margin-left:8px}
.arquivo-topo b{margin-left:auto;color:#FFD066;font-weight:700}
.arquivo pre{margin:0;padding:12px 0;font-size:11.5px;line-height:1.7;color:var(--cod-txt);overflow-x:auto;max-height:420px}
.arquivo .ln{display:block;padding:0 14px;white-space:pre}
.arquivo .ln.falta{color:#6F64A3;font-style:italic}
.arquivo-barra{height:5px;background:var(--cod-2)}.arquivo-barra div{height:100%;background:var(--sol);transition:width .5s}
.arquivo .ln.req{white-space:pre-wrap;padding-left:3.2em;text-indent:-2.4em}
.arquivo .ln.req.ok{color:#5FE3B5}.arquivo .ln.req.parte{color:#FFD066}.arquivo .ln.req.falta{color:#8379B6}
.arquivo .ln.req i{color:#8379B6;font-style:italic}

/* ---------- lição ---------- */
.licao{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--fundo);padding-top:env(safe-area-inset-top)}
.licao-topo{background:var(--fundo)}
.licao-topo-in{display:flex;align-items:center;gap:14px;padding:14px 20px;max-width:820px;margin:0 auto}
.fechar{width:40px;height:40px;flex:none;border:0;border-radius:12px;background:transparent;font-size:20px;font-weight:800;color:var(--suave)}
.fechar:hover{background:var(--card-2)}
.licao-meio{flex:1;min-width:0}
.licao-nome{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;min-width:0}
.licao-nome small{font-size:11.5px;font-weight:700;color:var(--cor-txt,var(--acao-txt));text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.licao-nome b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.contador{font-size:13px;font-weight:800;color:var(--suave);white-space:nowrap}
.topo-btn{border:2px solid var(--linha);background:var(--card);border-radius:12px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--texto-2)}
.barra{height:14px;background:var(--linha);border-radius:99px;overflow:hidden}
.barra div{height:100%;background:var(--cor,var(--acao));border-radius:99px;transition:width .4s cubic-bezier(.3,1.4,.5,1);position:relative}
.barra div::after{content:"";position:absolute;left:10px;right:10px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.corpo{flex:1;overflow-y:auto;width:100%}
.corpo-in{max-width:680px;margin:0 auto;padding:16px 20px 36px}
.entrar{animation:entrar .22s ease-out}
@keyframes entrar{from{opacity:0;transform:translateX(18px)}}
.corpo h2{font-size:24px;margin:6px 0 18px;line-height:1.28}
.corpo h2 code,.enunciado code,.fb code,.pagina code,.dicas code,.resumo code,.teoria-cartao code,.caixa-fim code,.modelo-bloco code,.entender code,.ia-texto code,.cartao-licao code,.nota code,.aviso code{background:var(--acao-claro);color:var(--acao-txt);padding:1px 6px;border-radius:6px;font-size:.88em}
.rodape{border-top:2px solid var(--linha);padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:var(--fundo)}
.rodape-in{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rodape-esq,.rodape-dir{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rodape-dir{margin-left:auto}
.rodape.certo{background:var(--ok-fundo);border-top-color:transparent}
.rodape.errado{background:var(--erro-fundo);border-top-color:transparent}
.rodape.certo .btn:not(.branco){background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-esc)}
.rodape.errado .btn:not(.branco){background:var(--erro);color:#fff;box-shadow:0 4px 0 var(--erro-esc)}
.fb{display:flex;gap:14px;align-items:flex-start;flex:1;min-width:240px}
.fb-ico{flex:none}
.fb h3{margin:2px 0 3px;font-size:22px}
.certo .fb h3{color:var(--ok-esc)}.errado .fb h3{color:var(--erro-esc)}
.fb p{margin:0;font-size:15px;line-height:1.5;color:var(--texto-2)}
.fb p small{color:var(--suave)}
.fb-acoes{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
pre.cod{background:var(--cod);color:var(--cod-txt);border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.65;overflow-x:auto;margin:0 0 16px;white-space:pre}
.t-k{color:#FF8FC8}.t-s{color:#8FF0BE}.t-c{color:#8379B6;font-style:italic}.t-n{color:#FFD479}.t-f{color:#8FC8FF}.t-a{color:#FFB37A}
.pagina{background:var(--card);border-radius:20px;padding:22px;border:2px solid var(--linha)}
.pagina-topo{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.pagina-topo h2{margin:0}
.pagina p,.pagina li{color:var(--texto-2);font-size:16px;line-height:1.7}
.pagina b{color:var(--texto)}
.pagina ol,.pagina ul{padding-left:22px}
.ensino-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.ensino-topo .kicker{color:var(--cor-txt,var(--acao-txt))}
.pontos{display:flex;gap:6px}
.pontos i{width:10px;height:10px;border-radius:99px;background:var(--linha);transition:width .2s}
.pontos i.visto{background:var(--cor,var(--acao));opacity:.45}
.pontos i.agora{background:var(--cor,var(--acao));width:26px}
.rotulo{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);margin:18px 0 8px}
#ex-saida{margin-top:12px}
.opcoes{display:grid;gap:12px}
.opcao{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--linha);border-radius:16px;padding:14px 16px;font-weight:600;font-size:16px;box-shadow:0 4px 0 var(--linha);color:var(--texto);transition:transform .06s}
.opcao:hover{background:var(--fundo-2)}
.opcao:active{transform:translateY(3px);box-shadow:0 1px 0 var(--linha)}
.opcao .num{width:30px;height:30px;flex:none;border:2px solid var(--linha-2);border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--suave)}
.opcao.sel{border-color:var(--acao);background:var(--acao-claro);box-shadow:0 4px 0 color-mix(in srgb,var(--acao) 40%,var(--linha))}
.opcao.sel .num{border-color:var(--acao);color:var(--acao-txt)}
.opcao.ok{border-color:var(--ok);background:var(--ok-fundo);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 40%,var(--linha))}
.opcao.ok .num{border-color:var(--ok);color:var(--ok-esc)}
.opcao.ruim{border-color:var(--erro);background:var(--erro-fundo);box-shadow:0 4px 0 color-mix(in srgb,var(--erro) 35%,var(--linha))}
.opcao.ruim .num{border-color:var(--erro);color:var(--erro-esc)}
.op-txt{flex:1;min-width:0}
.opcao code{font-size:.9em;white-space:pre-wrap;word-break:break-word}
.travado{pointer-events:none}
.lacuna{background:#2E2A48;border:0;border-bottom:3px solid #FFD066;color:#fff;font-size:inherit;padding:0 4px;border-radius:6px 6px 0 0;outline:none;text-align:center}
.lacuna:focus{background:#3A3560}
.lacuna.ok{border-color:#5FE3B5;color:#5FE3B5}
.lacuna.ruim{border-color:#FF8C98;color:#FF8C98}
.montagem{min-height:72px;border-top:2px solid var(--linha);border-bottom:2px solid var(--linha);padding:12px 0;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;align-content:flex-start}
.banco{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.peca{background:var(--card);border:2px solid var(--linha);border-radius:14px;padding:9px 13px;font-size:15px;font-weight:600;color:var(--texto);box-shadow:0 4px 0 var(--linha)}
.peca:active{transform:translateY(3px);box-shadow:0 1px 0 var(--linha)}
.peca.usada{background:var(--linha);border-color:var(--linha);color:transparent;box-shadow:none;pointer-events:none}
.montagem-vazia{color:var(--suave);font-size:14px;align-self:center}
.ajuda-montar{text-align:center;color:var(--suave);font-size:14px;margin-top:20px}
.enunciado{line-height:1.65;margin:-8px 0 14px;color:var(--texto-2);font-size:16px}
.enunciado b{color:var(--texto)}
.chips{margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:color-mix(in srgb,var(--papel) 13%,var(--card));color:color-mix(in srgb,var(--papel) 75%,var(--texto));font-size:13px;font-weight:700;padding:5px 11px;border-radius:99px}
.chip.verde{background:var(--ok-fundo);color:var(--ok-esc)}
.editor{border-radius:16px;overflow:hidden;background:var(--cod);margin-bottom:12px}
.editor-topo{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--cod-2);color:#B9B4D6;font-family:'JetBrains Mono',monospace;font-size:12px}
.editor-topo .atalhos{margin-left:auto}
.recomecar{background:none;border:1px solid #4A4570;border-radius:8px;color:#D8D3F0;font-size:12px;padding:3px 9px}
.editor textarea{display:block;width:100%;min-height:220px;resize:vertical;border:0;outline:none;background:transparent;color:var(--cod-txt);font-size:14px;line-height:1.65;padding:12px 16px;tab-size:4;white-space:pre;overflow:auto}
.editor.mini textarea{min-height:0}
.saida{border-radius:16px;overflow:hidden;background:var(--card);border:2px solid var(--linha)}
.saida-topo{background:var(--fundo-2);padding:6px 14px;font-size:12px;font-weight:800;color:var(--suave);text-transform:uppercase;letter-spacing:.06em}
.saida pre{margin:0;padding:12px 14px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;max-height:240px;overflow:auto;color:var(--texto)}
.saida .err{color:var(--erro);font-weight:500}
.saida .vazio{color:var(--suave)}
.entender{background:var(--aviso-fundo);padding:11px 14px;font-size:14.5px;line-height:1.55;color:var(--aviso-txt)}
.entender:empty{display:none}
.entender b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--aviso-forte);margin-bottom:2px}
.ferramentas{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.ferr{background:var(--card);border:2px solid var(--linha);border-radius:12px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--texto-2)}
.ferr:active{background:var(--fundo-2)}
.ferr.ativo{background:var(--acao-claro);border-color:color-mix(in srgb,var(--acao) 40%,var(--linha));color:var(--acao-txt)}
.dicas{background:var(--aviso-fundo);border-radius:16px;padding:14px 16px;margin:18px 0 14px}
.dicas ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.dicas li{font-size:15px;line-height:1.55;color:var(--aviso-txt)}
.dicas li small{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--aviso-forte);margin-bottom:2px}
.dicas li.nova{animation:entrar .22s ease-out}
.dicas-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ia{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--papel) 12%,var(--card));border-radius:18px;padding:12px 14px;margin:0 0 14px}
.ia-ico{font-size:22px;line-height:1}
.ia-texto{line-height:1.55;color:var(--texto-2);white-space:pre-wrap;min-width:0;flex:1;font-size:15px}
.ia-texto small,.sugestao small,.previa small{display:block;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;color:var(--acao-txt)}
.ia-texto pre.cod{margin:8px 0 4px;white-space:pre}
.ia-erro{color:var(--erro)}
.pensando::after{content:"…";animation:piscar 1s infinite}
@keyframes piscar{50%{opacity:.2}}
.sugestao{border:2px dashed var(--papel);background:color-mix(in srgb,var(--papel) 10%,var(--card));border-radius:16px;padding:10px 12px;margin:0 0 14px}
.sugestao pre.cod{margin:6px 0 10px}
.sugestao-acoes{display:flex;gap:8px;flex-wrap:wrap}
.previa{background:var(--card);border-radius:16px;padding:12px 14px;margin:0 0 14px;border:2px solid var(--linha)}
.previa-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.previa small{color:var(--suave);margin:0}
.previa pre.cod{margin:0}
.teclas{display:flex;gap:6px;overflow-x:auto;margin:-2px 0 12px;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.teclas button{flex:none;min-width:42px;height:42px;border:2px solid var(--linha);border-radius:12px;background:var(--card);color:var(--texto);font-weight:600;font-size:16px;padding:0 10px}
.teclas button:active{background:var(--acao-claro)}
.ensaio{background:var(--card);border:2px solid var(--linha);border-radius:18px;overflow:hidden;margin-bottom:14px}
.ensaio-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;border-bottom:2px solid var(--linha);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--suave)}
.cronometro{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--acao-txt)}
.cronometro.longo{color:var(--erro)}
.ensaio textarea{display:block;width:100%;border:0;outline:none;resize:vertical;padding:12px 14px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15.5px;line-height:1.55;background:transparent;color:var(--texto)}
.modelo{display:grid;gap:12px;margin-top:6px}
.modelo-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.modelo-bloco{background:var(--card);border:2px solid var(--linha);border-radius:18px;padding:14px 16px}
.modelo-bloco:first-child{border-color:var(--ok)}
.modelo-bloco p,.modelo-bloco li{color:var(--texto-2);line-height:1.65;font-size:15.5px}
.modelo-bloco ul{padding-left:20px;margin:6px 0 0}
.modelo-bloco.evitar{border-color:var(--erro)}
.checklist{list-style:none;padding:0 !important}
.checklist li{margin:7px 0}
.checklist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checklist input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok);flex:none}
mark.ajuste{background:var(--aviso-fundo);border:1.5px dashed var(--sol);border-radius:6px;padding:0 5px;color:var(--aviso-txt);font-weight:600}

/* ---------- resultado ---------- */
.resultado{max-width:620px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top)) 20px calc(56px + env(safe-area-inset-bottom))}
.resultado-topo{text-align:center}
.trofeu{display:flex;justify-content:center;gap:4px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.resultado h1{font-size:31px;margin:8px 0 6px;color:var(--texto)}
.resultado-topo > p{color:var(--texto-2);margin:0 0 6px}
.estrelas-grandes{text-align:center;margin:18px 0 0}
.estrelas-grandes .estrelas i{font-size:44px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards}
.estrelas-grandes .estrelas i:nth-child(2){animation-delay:.15s}.estrelas-grandes .estrelas i:nth-child(3){animation-delay:.3s}
.cartoes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 14px}
.cartao{border-radius:18px;padding:3px;text-align:center;background:var(--c,var(--sol))}
.cartao small{display:block;color:#fff;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:5px 2px 6px}
.cartao b{display:block;background:var(--fundo);border-radius:15px;padding:13px 4px;font-size:21px;color:var(--c-esc,var(--sol-esc))}
.c-xp{--c:var(--sol);--c-esc:var(--sol-esc)}.c-acerto{--c:var(--ok);--c-esc:var(--ok-esc)}.c-tempo{--c:var(--papel);--c-esc:color-mix(in srgb,var(--papel) 78%,var(--texto))}
.conquistas{display:grid;gap:10px;margin:6px 0 14px}
.conquista{display:flex;align-items:center;gap:14px;border-radius:18px;padding:12px 16px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards .35s}
.conquista .ic{width:34px;height:34px}
.conquista b{display:block;font-size:16.5px}
.conquista small{display:block;font-size:14px;color:var(--texto-2)}
.fogo-c{background:color-mix(in srgb,var(--fogo) 14%,var(--card))}.fogo-c .ic{color:var(--fogo)}
.meta-c{background:var(--ok-fundo)}.meta-c .ic{color:var(--ok)}
.prot-c{background:color-mix(in srgb,var(--papel) 14%,var(--card))}.prot-c .ic{color:var(--papel)}
.continuar-info{color:var(--suave);font-weight:600;font-size:14px}
.resumo{margin:0 0 22px;background:var(--card);border-radius:20px;padding:16px 18px;border:2px solid var(--linha)}
.resumo h3{font-size:19px;margin:0 0 10px}
.resumo ul{margin:0;padding-left:20px;display:grid;gap:7px}
.resumo li{color:var(--texto-2);line-height:1.55}
.resumo li::marker{color:var(--acao)}
.resultado-acoes{display:grid;gap:14px}
.caixa-fim{background:var(--card);border-radius:20px;padding:16px 18px;margin-bottom:20px;border:2px solid var(--linha)}
.caixa-fim h3{margin:0 0 8px;font-size:19px}
.caixa-fim p,.caixa-fim li{color:var(--texto-2);line-height:1.6}
.caixa-fim pre.cod{margin:10px 0}
.caixa-fim .btn{margin:6px 0 10px}
.aprendeu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 26px}
.aprendeu span{background:var(--card);font-size:13.5px;font-weight:600;padding:6px 12px;border-radius:99px;border:2px solid var(--linha)}
.confete{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}
.confete span{position:absolute;top:-50px;font-size:24px;animation:cair 2.6s ease-in forwards}
@keyframes cair{to{transform:translateY(115vh) rotate(540deg)}}
.toast{position:fixed;top:calc(76px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--texto);color:var(--fundo);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--sombra);animation:fade .2s}

/* ---------- janelas ---------- */
.modal-fundo{position:fixed;inset:0;background:rgba(15,14,24,.5);display:grid;place-items:center;padding:16px;z-index:30;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--fundo);border-radius:24px;max-width:660px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:24px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-fechar{position:absolute;top:14px;right:14px;width:36px;height:36px;border:0;border-radius:12px;background:var(--card-2);font-weight:800;color:var(--texto-2)}
.modal h3{margin:6px 0 8px;font-size:21px}
.modal .resumo{margin:12px 0 8px}
.teoria-cartao{border-bottom:2px solid var(--linha);padding:6px 0 10px}
.teoria-cartao:last-of-type{border-bottom:0}
.teoria-cartao h3{margin:12px 0 4px;font-size:18px}
.teoria-cartao p,.teoria-cartao li{line-height:1.65;color:var(--texto-2);font-size:15.5px}
.teoria-cartao pre.cod{margin:8px 0 6px}
.modal .btn.largo{margin-top:10px}
.modal.senha p{color:var(--texto-2)}
.modal.senha input{width:100%;font-size:16px;padding:12px 14px;border:2px solid var(--linha-2);border-radius:14px;margin:6px 0 14px;background:var(--card);color:var(--texto)}
.senha-erro{color:var(--erro);font-weight:700;margin:-6px 0 12px}
.aviso{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:25;background:var(--aviso-fundo);color:var(--aviso-txt);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--sombra)}
.aviso code{word-break:break-all}

@media (max-width:900px){
  .home{grid-template-columns:1fr;gap:22px}
  .lateral{display:contents}
  .trilha-tela .lateral .continuar{display:none}
  .lateral > *{order:1}
  /* no celular, as abas vão para baixo, como num app */
  .abas-topo{display:none}
  .abas-baixo{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;justify-content:space-around;gap:0;
    background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
    border-top:1px solid var(--linha);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .abas-baixo .aba{flex:1;flex-direction:column;gap:2px;padding:6px 4px;font-size:12px;border-radius:14px;max-width:120px}
  .abas-baixo .aba .ic{width:24px;height:24px}
  .abas-baixo .aba.ativa{background:none}
  .abas-baixo .aba.ativa .ic{background:var(--acao-claro);border-radius:99px;width:52px;padding:2px 14px;box-sizing:border-box}
  .tela{padding-bottom:calc(var(--abas-h) + 36px + env(safe-area-inset-bottom))}
}
@media (max-width:520px){
  .rotulo-btn{display:none}
  .uma-linha .rodape-esq .btn{flex:none;min-width:52px;padding:12px 14px}
  .caminho{gap:18px;padding-top:40px}
  .item{transform:translateX(calc(var(--x) * .75))}
  .item.atual{margin-top:26px}
  .hex{width:70px;height:64px}
  .no .ico{font-size:25px}
  .rotulo-no{margin-top:7px}
  .rotulo-no b{font-size:13px}
  .mundo{margin-bottom:22px}
  .modelo-bloco{padding:12px 14px}
  .modelo-bloco p,.modelo-bloco li{font-size:15px;line-height:1.6}
  .checklist label{padding:4px 0}
  .ensaio textarea{min-height:110px}
  .pagina p,.pagina li{font-size:15.5px}
  .opcao{padding:12px 14px;font-size:15px}
  .topo-in{padding:9px 16px}
  .marca{font-size:19px}
  .marca-trio .pers{width:21px;height:21px}
  .stat{padding:5px 9px;font-size:14.5px}
  .tela{padding-left:16px;padding-right:16px;padding-top:16px}
  .saudacao h1{font-size:24px}
  .boas-vindas h1{font-size:23px}
  .mundo-banner h2{font-size:19px}
  .mundo-banner .pers{width:48px;height:48px}
  .guia{left:calc(100% + 8px)}
  .guia .pers{width:52px;height:52px}
  .painel-dia{gap:14px;padding:14px}
  .anel{width:76px;height:76px}.anel span{width:60px;height:60px}.anel b{font-size:19px}
  .heroi{padding:18px 16px 18px;border-radius:24px}
  .heroi h2{font-size:23px;max-width:calc(100% - 78px)}
  .heroi p{font-size:15px;max-width:calc(100% - 50px)}
  .heroi-guia{right:6px;top:54px}.heroi-guia .pers{width:74px;height:74px}
  .numeros{grid-template-columns:repeat(2,1fr)}
  .metas{gap:8px}
  .linha-ajuste{flex-wrap:wrap}
  .licao-topo-in{padding:10px 12px;gap:10px}
  .topo-btn span{display:none}
  .corpo-in{padding:14px 16px 32px}
  .corpo h2{font-size:21px}
  .pagina{padding:18px}
  .pagina-topo .pers{width:44px;height:44px}
  .rodape{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .rodape .btn{padding:13px 14px}
  .rodape-esq,.rodape-dir{width:100%}
  .rodape-esq .btn,.rodape-dir .btn{flex:1}
  .rodape-in > #principal{flex:1 1 100%}
  .uma-linha .rodape-esq{width:auto}
  .uma-linha .rodape-dir{width:auto;flex:1;flex-wrap:nowrap}
  .fb-ico .pers{width:46px;height:46px}
  .fb-acoes{width:100%}
  .fb-acoes .btn{flex:1}
  .editor textarea{min-height:170px;font-size:13px}
  .editor-topo .atalhos{display:none}
  .recomecar{margin-left:auto}
  .cartoes{gap:8px}
  .cartao b{font-size:17px}
  pre.cod{font-size:12.5px;padding:12px 14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

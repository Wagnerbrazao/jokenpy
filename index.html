<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Estude programação todo dia: Python, Java + Spring Boot, React, Django e SQL em lições curtas, com exercícios corrigidos na hora.">
<title>Jokenpy · estude programação todo dia</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icones/icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icones/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jokenpy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Jokenpy: app de estudo diário, limpo e feito para o celular.
   Fundo neutro, bordas finas, uma cor de destaque por trilha (--acao) e movimento só onde dá retorno:
   anéis que enchem, a ofensiva, o combo e o feedback que sobe como uma gaveta. */
:root{
  --acao:#5B5BF0;
  --acao-esc:color-mix(in srgb,var(--acao) 80%,#000);
  --acao-claro:color-mix(in srgb,var(--acao) 9%,var(--card));
  --acao-txt:color-mix(in srgb,var(--acao) 85%,var(--texto));
  --fundo:#FFFFFF;--fundo-2:#F6F6F9;--card:#FFFFFF;--card-2:#F3F3F7;--linha:#EAEAF0;--linha-2:#D9D9E2;
  --texto:#121218;--texto-2:#52525F;--suave:#8B8B99;
  --sol:#FFB020;--sol-esc:#C98700;--fogo:#FF6A1A;
  --pedra:#FF6B5B;--papel:#4A9DFF;--tesoura:#1FC58F;
  --ok:#12B76A;--ok-esc:#0A8A50;--ok-fundo:color-mix(in srgb,var(--ok) 10%,var(--card));
  --erro:#F04438;--erro-esc:#C4320A;--erro-fundo:color-mix(in srgb,var(--erro) 9%,var(--card));
  --aviso-fundo:#FFF7E0;--aviso-txt:#5C4500;--aviso-forte:#9A6B00;
  --cod:#16151F;--cod-2:#22202F;--cod-txt:#EEEBFF;
  --raio:20px;--sombra:0 1px 2px rgba(18,18,24,.04);--sombra-alta:0 10px 30px rgba(18,18,24,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-tema=claro]){
  --fundo:#0B0B10;--fundo-2:#121219;--card:#15151D;--card-2:#1D1D27;--linha:#262630;--linha-2:#34343F;
  --texto:#F4F4F7;--texto-2:#B9B9C6;--suave:#7F7F8F;
  --acao-claro:color-mix(in srgb,var(--acao) 18%,var(--card));--acao-txt:color-mix(in srgb,var(--acao) 50%,#fff);
  --ok-fundo:color-mix(in srgb,var(--ok) 16%,var(--card));--erro-fundo:color-mix(in srgb,var(--erro) 15%,var(--card));
  --aviso-fundo:#2A2310;--aviso-txt:#F3DFA8;--aviso-forte:#FFC94D;--cod:#101018;--cod-2:#1B1A26;
  --sombra:none;--sombra-alta:0 10px 30px rgba(0,0,0,.4);color-scheme:dark;
}}
:root[data-tema=escuro]{
  --fundo:#0B0B10;--fundo-2:#121219;--card:#15151D;--card-2:#1D1D27;--linha:#262630;--linha-2:#34343F;
  --texto:#F4F4F7;--texto-2:#B9B9C6;--suave:#7F7F8F;
  --acao-claro:color-mix(in srgb,var(--acao) 18%,var(--card));--acao-txt:color-mix(in srgb,var(--acao) 50%,#fff);
  --ok-fundo:color-mix(in srgb,var(--ok) 16%,var(--card));--erro-fundo:color-mix(in srgb,var(--erro) 15%,var(--card));
  --aviso-fundo:#2A2310;--aviso-txt:#F3DFA8;--aviso-forte:#FFC94D;--cod:#101018;--cod-2:#1B1A26;
  --sombra:none;--sombra-alta:0 10px 30px rgba(0,0,0,.4);color-scheme:dark;
}
.cor-pedra{--cor:var(--pedra)}.cor-papel{--cor:var(--papel)}.cor-tesoura{--cor:var(--tesoura)}
[class*=cor-]{--cor-esc:color-mix(in srgb,var(--cor) 78%,#000);--cor-claro:color-mix(in srgb,var(--cor) 11%,var(--card));--cor-txt:color-mix(in srgb,var(--cor) 70%,var(--texto))}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:var(--texto);background:var(--fundo);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh}
h1,h2,h3{font-weight:700;letter-spacing:-.015em}
button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}
input{font:inherit;color:inherit}
code,pre,textarea,.peca,.teclas button,.lacuna{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--acao) 50%,transparent);outline-offset:2px}
.ic{display:inline-block;flex:none;vertical-align:-.2em}

/* botões planos; encolhem um pouco ao toque */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;min-height:50px;padding:12px 20px;font-weight:700;font-size:16px;
  color:#fff;background:var(--acao);transition:transform .12s cubic-bezier(.3,.7,.4,1),filter .12s,background .15s;text-decoration:none}
.btn .ic{width:19px;height:19px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn:disabled{background:var(--card-2);color:var(--suave);cursor:default;filter:none;transform:none}
.btn.branco{background:var(--card-2);color:var(--texto)}
.btn.azul{background:var(--papel)}
.btn.vermelho{background:var(--erro)}
.btn.verde{background:var(--ok)}
.btn.largo{width:100%}
.btn.grande{min-height:56px;font-size:17px;border-radius:16px}
.btn.mini{min-height:36px;padding:7px 14px;font-size:14px;border-radius:11px}
.link{background:none;border:0;color:var(--suave);font-weight:600;text-decoration:underline;text-underline-offset:3px;display:block;margin:28px auto 0;font-size:14px}
.kicker{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--suave)}
.nota{color:var(--texto-2);font-size:14.5px;line-height:1.6;margin:8px 0 12px}
.nota.centro{text-align:center;color:var(--suave);font-size:13.5px}
.nota .ic{width:17px;height:17px;color:var(--acao-txt)}

.pers{display:block;flex:none;overflow:visible}
.flutua{animation:flutua 2.8s ease-in-out infinite}
@keyframes flutua{50%{transform:translateY(-6px) rotate(-3deg)}}
.pula{animation:pula .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pula{from{transform:scale(.5) rotate(-10deg)}}
.balanca{animation:balanca .5s ease-in-out}
@keyframes balanca{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}

/* anéis de progresso que enchem ao abrir a tela */
.anel-svg .anel-fundo{stroke:var(--linha)}
.anel-svg .anel-cheio{stroke:var(--cor-t,var(--acao));animation:encher .9s cubic-bezier(.3,.7,.3,1) .15s forwards}
.anel-svg.sol .anel-cheio{stroke:var(--sol)}
.bateu .anel-svg.sol .anel-cheio{stroke:var(--ok)}
@keyframes encher{to{stroke-dashoffset:var(--alvo)}}

/* ---------- casca ---------- */
.topo{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--fundo) 88%,transparent);backdrop-filter:saturate(1.8) blur(16px);-webkit-backdrop-filter:saturate(1.8) blur(16px);padding-top:env(safe-area-inset-top)}
.topo-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;padding:10px 20px;gap:16px}
.marca{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-weight:800;font-size:19px;letter-spacing:-.03em;color:var(--texto)}
.marca b{color:var(--acao-txt)}
.marca-trio{display:flex}.marca-trio .pers{margin-right:-6px}
.stats{display:flex;gap:4px;align-items:center;margin-left:auto}
.stat{display:inline-flex;align-items:center;gap:3px;padding:6px 8px;border-radius:10px;font-weight:800;font-size:15px}
.stat .ic{width:19px;height:19px}
.stat.fogo{color:var(--suave)}.stat.fogo.aceso{color:var(--fogo)}
.stat.fogo.risco{color:var(--fogo)}.stat.fogo.risco .ic{animation:chama 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes chama{50%{transform:scale(1.12) rotate(-4deg)}}
.stat.raio{color:var(--sol-esc)}
.abas{display:flex;gap:2px}
.aba{display:flex;align-items:center;gap:7px;background:none;border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14.5px;color:var(--suave)}
.aba:hover{color:var(--texto-2)}
.aba.ativa{color:var(--acao-txt)}
.abas-baixo{display:none}
.tela{max-width:1080px;margin:0 auto;padding:18px 20px 60px}
.tela.hoje,.tela.perfil,.tela.trilhas-tela{max-width:640px}
.saudacao{margin:2px 0 18px}
.saudacao h1{font-size:27px;line-height:1.2;margin:4px 0 0}
.saudacao p{color:var(--texto-2);margin:8px 0 0}
.bloco{margin-top:26px}
.titulo-bloco{font-size:13px !important;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);font-weight:700;margin:0 0 10px !important}
.cartao-bloco{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:18px}
.cartao-bloco h3{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:17px}
.cartao-bloco h3.sub{margin-top:20px}
.cartao-bloco h3 .ic{color:var(--acao-txt)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dupla .btn.largo{grid-column:1/-1}
.barra-fina{flex:1;display:block;height:6px;border-radius:99px;background:var(--linha);overflow:hidden}
.barra-fina i{display:block;height:100%;border-radius:99px;background:var(--cor-t,var(--acao));transition:width .6s cubic-bezier(.3,.7,.3,1)}

/* ---------- Hoje ---------- */
.foco{--cor-t:var(--acao);background:var(--card);border:1px solid var(--linha);border-radius:24px;padding:18px;box-shadow:var(--sombra-alta);margin-bottom:14px;animation:subir .35s cubic-bezier(.3,.7,.3,1)}
@keyframes subir{from{opacity:0;transform:translateY(10px)}}
.foco-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.foco-trilha{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--cor-t) 10%,var(--card));color:color-mix(in srgb,var(--cor-t) 80%,var(--texto));border:0;border-radius:99px;padding:5px 12px;font-weight:700;font-size:13.5px}
.foco-tempo{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:13.5px;color:var(--suave)}
.foco-tempo .ic{width:16px;height:16px}
.foco-meio{display:flex;align-items:center;gap:16px}
.foco-anel{position:relative;flex:none;width:92px;height:92px}
.foco-ico{position:absolute;inset:14px;border-radius:50%;background:color-mix(in srgb,var(--cor-t) 10%,var(--card));display:grid;place-items:center;font-size:32px}
.foco-txt small{display:block;color:var(--suave);font-weight:600;font-size:13px}
.foco-txt h2{font-size:23px;line-height:1.2;margin:2px 0 0}
.foco-porque{color:var(--texto-2);margin:14px 0 12px;font-size:15.5px;line-height:1.5}
.foco-gancho{display:flex;align-items:center;gap:8px;margin:0 0 16px;padding:10px 12px;border-radius:12px;background:var(--fundo-2);color:var(--texto-2);font-size:14px}
.foco-gancho .ic{width:18px;height:18px;color:var(--sol);flex:none}
.foco .btn{background:var(--cor-t)}
.dia{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:14px 16px;margin-bottom:14px}
.dia-meta{position:relative;flex:none;width:64px;height:64px}
.dia-meta > span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dia-meta b{font-size:18px;font-weight:800}
.dia-meta small{font-size:10.5px;font-weight:700;color:var(--suave)}
.dia-semana{flex:1;min-width:0}
.dia-linha{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.fogo-txt{display:inline-flex;align-items:center;gap:4px;font-size:16px;color:var(--texto)}
.fogo-txt .ic{color:var(--suave);width:20px;height:20px}.fogo-txt.aceso .ic{color:var(--fogo)}
.protetor{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:13.5px;color:var(--papel)}
.protetor .ic{width:16px;height:16px}
.semana{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.semana li{display:flex;flex-direction:column;align-items:center;gap:3px}
.semana span{font-size:11px;font-weight:700;color:var(--suave)}
.semana i{width:100%;max-width:30px;aspect-ratio:1;border-radius:50%;background:var(--card-2);display:grid;place-items:center;color:#fff}
.semana i .ic{width:14px;height:14px}
.semana .fez i{background:var(--fogo);animation:pop .4s cubic-bezier(.2,1.6,.4,1) backwards}
.semana .prot i{background:color-mix(in srgb,var(--papel) 20%,var(--card));color:var(--papel)}
.semana .hoje span{color:var(--texto)}
.semana .hoje:not(.fez) i{box-shadow:inset 0 0 0 2px var(--fogo);animation:respira 2s ease-in-out infinite}
@keyframes respira{50%{box-shadow:inset 0 0 0 2px var(--fogo),0 0 0 4px color-mix(in srgb,var(--fogo) 18%,transparent)}}
/* lista agrupada, como nos ajustes do celular */
.linhas{background:var(--card);border:1px solid var(--linha);border-radius:22px;overflow:hidden}
.linhas:empty{display:none}
.linha{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--linha);padding:14px 16px;color:var(--texto)}
.linha:first-child{border-top:0}
button.linha:active{background:var(--fundo-2)}
.linha > .ic{color:var(--suave);width:18px;height:18px}
.li-ico{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:21px}
.li-ico .ic{width:21px;height:21px}
.li-ico.azul{background:color-mix(in srgb,var(--papel) 13%,var(--card));color:var(--papel)}
.li-ico.sol{background:color-mix(in srgb,var(--sol) 16%,var(--card));color:var(--sol-esc)}
.li-ico.verde{background:color-mix(in srgb,var(--tesoura) 14%,var(--card));color:var(--ok-esc)}
.li-txt{flex:1;min-width:0}
.li-txt b{display:block;font-size:15.5px;font-weight:700}
.li-txt small{display:block;color:var(--texto-2);font-size:13.5px;line-height:1.35;margin-top:1px}
.li-botoes{display:flex;align-items:center;gap:2px}
.selo{min-width:26px;height:26px;padding:0 8px;border-radius:99px;background:var(--papel);color:#fff;font-weight:800;font-size:13.5px;display:grid;place-items:center}
.dispensar{background:none;border:0;color:var(--suave);font-size:15px;padding:6px 8px;border-radius:8px}
.mini-trilhas{display:grid;gap:8px}
.mini-trilha{--cor-t:var(--acao);display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--linha);border-radius:16px;padding:12px 14px;color:var(--texto)}
.mt-ico{font-size:22px}
.mt-txt{flex:1;display:grid;gap:6px}
.mt-txt b{font-size:15px}
.mini-trilha small{color:var(--suave);font-weight:700;font-size:12.5px}

/* ---------- Trilhas ---------- */
.lista-trilhas{display:grid;gap:10px}
.card-trilha{--cor-t:var(--acao);display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--linha);border-radius:20px;padding:14px 16px;color:var(--texto);transition:transform .12s}
.card-trilha.atual{border-color:color-mix(in srgb,var(--cor-t) 45%,var(--linha))}
.card-trilha:active{transform:scale(.985)}
.ct-ico{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--cor-t) 11%,var(--card))}
.ct-ico.grande{width:60px;height:60px;font-size:32px;border-radius:18px;margin-bottom:12px}
.ct-txt{flex:1;min-width:0;display:block}
.ct-txt b{display:block;font-size:17px}
.ct-txt > span{display:block;color:var(--texto-2);font-size:14px;line-height:1.4}
.ct-prog{display:flex !important;align-items:center;gap:10px;margin-top:10px}
.ct-prog small{color:var(--suave);font-size:12.5px;font-weight:700;white-space:nowrap}
.ct-atual{align-self:flex-start;font-size:11.5px;font-weight:800;color:color-mix(in srgb,var(--cor-t) 80%,var(--texto));background:color-mix(in srgb,var(--cor-t) 11%,var(--card));padding:3px 8px;border-radius:99px}

/* ---------- Você ---------- */
.numeros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.numeros > div{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:14px 8px;text-align:center}
.numeros b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:23px;font-weight:800;letter-spacing:-.03em}
.numeros b .ic{width:19px;height:19px}
.numeros > div:first-child .ic{color:var(--fogo)}.numeros > div:nth-child(3) .ic{color:var(--sol-esc)}
.numeros small{display:block;color:var(--suave);font-weight:600;font-size:12px;line-height:1.25;margin-top:2px}
.constancia{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:12px 0 2px}
.constancia .col{display:grid;gap:4px}
.constancia i{display:block;aspect-ratio:1;border-radius:4px;background:var(--card-2)}
.constancia i.n1{background:color-mix(in srgb,var(--fogo) 30%,var(--card))}
.constancia i.n2{background:color-mix(in srgb,var(--fogo) 55%,var(--card))}
.constancia i.n3{background:color-mix(in srgb,var(--fogo) 80%,var(--card))}
.constancia i.n4{background:var(--fogo)}
.constancia i.prot{background:color-mix(in srgb,var(--papel) 40%,var(--card))}
.constancia i.fut{opacity:.35}
.linha-ajuste{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--linha)}
.linha-ajuste:first-of-type{border-top:0}
.linha-ajuste span,.linha-ajuste label{font-weight:600}
.linha-ajuste input[type=time]{font-size:18px;font-weight:700;padding:8px 12px;border-radius:12px;border:1px solid var(--linha-2);background:var(--fundo-2);color:var(--texto)}
.metas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.meta-op{background:var(--card);border:1.5px solid var(--linha);border-radius:16px;padding:12px 6px;text-align:center;color:var(--texto);transition:border-color .15s,background .15s}
.meta-op b{display:block;font-size:15.5px}
.meta-op span{display:block;font-weight:800;color:var(--sol-esc);font-size:14px}
.meta-op small{display:block;color:var(--suave);font-size:12px;line-height:1.3;margin-top:2px}
.meta-op.sel{border-color:var(--acao);background:var(--acao-claro)}
.segmento{display:flex;background:var(--card-2);border-radius:12px;padding:3px;gap:2px}
.segmento button{border:0;background:none;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13.5px;color:var(--texto-2)}
.segmento button.sel{background:var(--card);color:var(--texto);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chave{width:52px;height:30px;border-radius:99px;border:0;background:var(--linha-2);position:relative;flex:none;transition:background .15s}
.chave i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,.7,.3,1)}
.chave.ligada{background:var(--ok)}.chave.ligada i{transform:translateX(22px)}
.lembrete-msg{background:var(--ok-fundo);color:var(--ok-esc);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;margin:4px 0 12px}
.lembrete-msg.erro{background:var(--erro-fundo);color:var(--erro-esc)}
.arquivo-btn{cursor:pointer}
.passos{padding-left:22px;line-height:1.7;color:var(--texto-2)}
.passos b{color:var(--texto)}

/* ---------- uma trilha: linha do tempo ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:40px;align-items:start;max-width:980px;margin:0 auto}
.caminho-col{max-width:640px}
.lateral{position:sticky;top:76px;display:grid;gap:14px}
.voltar-trilhas{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--suave);font-weight:700;font-size:14.5px;margin-bottom:10px}
.voltar-trilhas .ic{width:18px;height:18px}
.trilha-cabeca{margin:0 0 26px}
.trilha-cabeca h1{font-size:25px;line-height:1.22;margin:4px 0 8px}
.trilha-cabeca h1 em{font-style:normal;color:color-mix(in srgb,var(--cor-t) 85%,var(--texto))}
.trilha-cabeca p{color:var(--texto-2);margin:0;font-size:15px}
.parte{margin-bottom:22px}
.parte-cab{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.parte-cab small{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;color:var(--cor-txt)}
.parte-cab h2{margin:0;font-size:19px;line-height:1.2}
.linha-tempo{list-style:none;margin:0;padding:0 0 0 0;position:relative}
.etapa{position:relative;padding-left:0}
.etapa::before{content:"";position:absolute;left:23px;top:0;bottom:0;width:2px;background:var(--linha)}
.etapa:first-child::before{top:24px}.etapa:last-child::before{bottom:calc(100% - 24px)}
.etapa.feita::before{background:var(--cor)}
.etapa-btn{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;padding:8px 0;color:var(--texto)}
.etapa-no{position:relative;z-index:1;width:48px;height:48px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--card);border:2px solid var(--linha);transition:transform .15s}
.etapa-btn:active .etapa-no{transform:scale(.92)}
.etapa.feita .etapa-no{background:var(--cor);border-color:var(--cor);color:#fff}
.etapa.feita .etapa-no .ic{width:22px;height:22px}
.etapa.atual .etapa-no{border-color:var(--cor);background:var(--cor-claro);box-shadow:0 0 0 5px color-mix(in srgb,var(--cor) 18%,transparent);animation:respira-no 2.2s ease-in-out infinite}
@keyframes respira-no{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--cor) 10%,transparent)}}
.etapa-txt{flex:1;min-width:0}
.etapa-txt b{display:block;font-size:15.5px;line-height:1.3}
.etapa-txt small{display:block;color:var(--suave);font-size:12.5px;font-weight:600}
.etapa:not(.feita):not(.atual) .etapa-txt b{color:var(--texto-2)}
.etapa-foco{margin:2px 0 12px 62px;padding:14px;border-radius:16px;background:var(--cor-claro);animation:subir .3s cubic-bezier(.3,.7,.3,1)}
.etapa-foco p{margin:0 0 12px;color:var(--texto);font-size:14.5px;line-height:1.5}
.etapa-foco .btn{background:var(--acao)}
.estrelas{display:inline-flex;gap:1px;font-style:normal}
.estrelas i{font-style:normal;color:var(--linha-2);font-size:14px}
.estrelas i.acesa{color:var(--sol)}
.cartao-licao{margin:2px 0 12px 62px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--linha);animation:subir .25s cubic-bezier(.3,.7,.3,1)}
.cartao-licao h3{margin:0 0 4px;font-size:16.5px}
.cartao-licao p{margin:0 0 12px;font-size:14px;color:var(--texto-2)}
.cartao-licao p.porque{color:var(--texto);font-weight:600}
.cartao-licao .acoes{display:grid;gap:8px}
.cartao-licao .btn{background:var(--acao)}
.cartao-licao .btn.branco{background:var(--card-2);color:var(--texto)}
.cartao-lado{background:var(--card);border-radius:var(--raio);padding:16px 18px;border:1px solid var(--linha)}
.cartao-lado b{display:block;font-size:17px;font-weight:700}
.cartao-lado span{color:var(--texto-2);font-size:14px}
.cartao-lado .btn{margin-top:12px}
.revisao{display:grid;gap:2px}
.arquivo{border-radius:var(--raio);background:var(--cod);overflow:hidden}
.arquivo-topo{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--cod-2);color:#B9B4D6;font-family:'JetBrains Mono',monospace;font-size:12px}
.arquivo-topo .pers{margin-right:-4px}
.arquivo-topo span{margin-left:8px}
.arquivo-topo b{margin-left:auto;color:#FFD066;font-weight:700}
.arquivo pre{margin:0;padding:12px 0;font-size:11.5px;line-height:1.7;color:var(--cod-txt);overflow-x:auto;max-height:420px}
.arquivo .ln{display:block;padding:0 14px;white-space:pre}
.arquivo .ln.falta{color:#6F64A3;font-style:italic}
.arquivo-barra{height:4px;background:var(--cod-2)}.arquivo-barra div{height:100%;background:var(--sol);transition:width .5s}
.arquivo .ln.req{white-space:pre-wrap;padding-left:3.2em;text-indent:-2.4em}
.arquivo .ln.req.ok{color:#5FE3B5}.arquivo .ln.req.parte{color:#FFD066}.arquivo .ln.req.falta{color:#8379B6}
.arquivo .ln.req i{color:#8379B6;font-style:italic}

/* ---------- desafio relâmpago ---------- */
.gancho-selo{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--sol) 12%,var(--card));margin-bottom:16px}
.raio-ico{width:36px;height:36px;flex:none;border-radius:50%;background:var(--sol);color:#fff;display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.raio-ico .ic{width:20px;height:20px}
.gancho-selo b{display:block;font-size:15px}
.gancho-selo small{display:block;color:var(--texto-2);font-size:13px}
.gancho-titulo{margin:0 0 4px !important}
.gancho-pergunta{color:var(--texto-2);font-size:16px;margin:0 0 14px}
.revelacao{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--acao-claro);animation:subir .3s cubic-bezier(.3,.7,.3,1)}
.revelacao > b{display:block;font-size:16px;margin-bottom:4px}
.revelacao p{margin:0;color:var(--texto-2);line-height:1.6;font-size:15.5px}
.dica-rodape{color:var(--suave);font-weight:600;font-size:14px}
.combo{font-size:13px;font-weight:800;color:var(--fogo);white-space:nowrap}
.combo.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* ---------- lição ---------- */
.licao{display:flex;flex-direction:column;height:100vh;height:100dvh;background:var(--fundo);padding-top:env(safe-area-inset-top)}
.licao-topo{background:var(--fundo)}
.licao-topo-in{display:flex;align-items:center;gap:14px;padding:14px 20px;max-width:820px;margin:0 auto}
.fechar{width:40px;height:40px;flex:none;border:0;border-radius:12px;background:transparent;font-size:20px;font-weight:800;color:var(--suave)}
.fechar:hover{background:var(--card-2)}
.licao-meio{flex:1;min-width:0}
.licao-nome{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;min-width:0}
.licao-nome small{font-size:11.5px;font-weight:700;color:var(--cor-txt,var(--acao-txt));text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.licao-nome b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.contador{font-size:13px;font-weight:800;color:var(--suave);white-space:nowrap}
.topo-btn{border:2px solid var(--linha);background:var(--card);border-radius:12px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--texto-2)}
.barra{height:14px;background:var(--linha);border-radius:99px;overflow:hidden}
.barra div{height:100%;background:var(--cor,var(--acao));border-radius:99px;transition:width .4s cubic-bezier(.3,1.4,.5,1);position:relative}
.barra div::after{content:"";position:absolute;left:10px;right:10px;top:3px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.corpo{flex:1;overflow-y:auto;width:100%}
.corpo-in{max-width:680px;margin:0 auto;padding:16px 20px 36px}
.entrar{animation:entrar .22s ease-out}
@keyframes entrar{from{opacity:0;transform:translateX(18px)}}
.corpo h2{font-size:24px;margin:6px 0 18px;line-height:1.28}
.corpo h2 code,.enunciado code,.fb code,.pagina code,.dicas code,.resumo code,.teoria-cartao code,.caixa-fim code,.modelo-bloco code,.entender code,.ia-texto code,.cartao-licao code,.nota code,.aviso code,.revelacao code,.gancho-pergunta code,.foco-porque code{background:var(--acao-claro);color:var(--acao-txt);padding:1px 6px;border-radius:6px;font-size:.88em}
.rodape{border-top:2px solid var(--linha);padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:var(--fundo)}
.rodape-in{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rodape-esq,.rodape-dir{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rodape-dir{margin-left:auto}
.rodape.certo{background:var(--ok-fundo);border-top-color:transparent}
.rodape.errado{background:var(--erro-fundo);border-top-color:transparent}
.rodape.certo .btn:not(.branco){background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-esc)}
.rodape.errado .btn:not(.branco){background:var(--erro);color:#fff;box-shadow:0 4px 0 var(--erro-esc)}
.fb{display:flex;gap:14px;align-items:flex-start;flex:1;min-width:240px}
.fb-ico{flex:none}
.fb h3{margin:2px 0 3px;font-size:22px}
.certo .fb h3{color:var(--ok-esc)}.errado .fb h3{color:var(--erro-esc)}
.fb p{margin:0;font-size:15px;line-height:1.5;color:var(--texto-2)}
.fb p small{color:var(--suave)}
.fb-acoes{display:flex;gap:10px;align-items:center;margin-left:auto;flex-wrap:wrap}
pre.cod{background:var(--cod);color:var(--cod-txt);border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.65;overflow-x:auto;margin:0 0 16px;white-space:pre}
.t-k{color:#FF8FC8}.t-s{color:#8FF0BE}.t-c{color:#8379B6;font-style:italic}.t-n{color:#FFD479}.t-f{color:#8FC8FF}.t-a{color:#FFB37A}
.pagina{background:var(--card);border-radius:20px;padding:22px;border:2px solid var(--linha)}
.pagina-topo{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.pagina-topo h2{margin:0}
.pagina p,.pagina li{color:var(--texto-2);font-size:16px;line-height:1.7}
.pagina b{color:var(--texto)}
.pagina ol,.pagina ul{padding-left:22px}
.ensino-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.ensino-topo .kicker{color:var(--cor-txt,var(--acao-txt))}
.pontos{display:flex;gap:6px}
.pontos i{width:10px;height:10px;border-radius:99px;background:var(--linha);transition:width .2s}
.pontos i.visto{background:var(--cor,var(--acao));opacity:.45}
.pontos i.agora{background:var(--cor,var(--acao));width:26px}
.rotulo{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--suave);margin:18px 0 8px}
#ex-saida{margin-top:12px}
.opcoes{display:grid;gap:12px}
.opcao{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--linha);border-radius:16px;padding:14px 16px;font-weight:600;font-size:16px;box-shadow:0 4px 0 var(--linha);color:var(--texto);transition:transform .06s}
.opcao:hover{background:var(--fundo-2)}
.opcao:active{transform:translateY(3px);box-shadow:0 1px 0 var(--linha)}
.opcao .num{width:30px;height:30px;flex:none;border:2px solid var(--linha-2);border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--suave)}
.opcao.sel{border-color:var(--acao);background:var(--acao-claro);box-shadow:0 4px 0 color-mix(in srgb,var(--acao) 40%,var(--linha))}
.opcao.sel .num{border-color:var(--acao);color:var(--acao-txt)}
.opcao.ok{border-color:var(--ok);background:var(--ok-fundo);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 40%,var(--linha))}
.opcao.ok .num{border-color:var(--ok);color:var(--ok-esc)}
.opcao.ruim{border-color:var(--erro);background:var(--erro-fundo);box-shadow:0 4px 0 color-mix(in srgb,var(--erro) 35%,var(--linha))}
.opcao.ruim .num{border-color:var(--erro);color:var(--erro-esc)}
.op-txt{flex:1;min-width:0}
.opcao code{font-size:.9em;white-space:pre-wrap;word-break:break-word}
.travado{pointer-events:none}
.lacuna{background:#2E2A48;border:0;border-bottom:3px solid #FFD066;color:#fff;font-size:inherit;padding:0 4px;border-radius:6px 6px 0 0;outline:none;text-align:center}
.lacuna:focus{background:#3A3560}
.lacuna.ok{border-color:#5FE3B5;color:#5FE3B5}
.lacuna.ruim{border-color:#FF8C98;color:#FF8C98}
.montagem{min-height:72px;border-top:2px solid var(--linha);border-bottom:2px solid var(--linha);padding:12px 0;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px;align-content:flex-start}
.banco{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.peca{background:var(--card);border:2px solid var(--linha);border-radius:14px;padding:9px 13px;font-size:15px;font-weight:600;color:var(--texto);box-shadow:0 4px 0 var(--linha)}
.peca:active{transform:translateY(3px);box-shadow:0 1px 0 var(--linha)}
.peca.usada{background:var(--linha);border-color:var(--linha);color:transparent;box-shadow:none;pointer-events:none}
.montagem-vazia{color:var(--suave);font-size:14px;align-self:center}
.ajuda-montar{text-align:center;color:var(--suave);font-size:14px;margin-top:20px}
.enunciado{line-height:1.65;margin:-8px 0 14px;color:var(--texto-2);font-size:16px}
.enunciado b{color:var(--texto)}
.chips{margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:color-mix(in srgb,var(--papel) 13%,var(--card));color:color-mix(in srgb,var(--papel) 75%,var(--texto));font-size:13px;font-weight:700;padding:5px 11px;border-radius:99px}
.chip.verde{background:var(--ok-fundo);color:var(--ok-esc)}
.editor{border-radius:16px;overflow:hidden;background:var(--cod);margin-bottom:12px}
.editor-topo{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--cod-2);color:#B9B4D6;font-family:'JetBrains Mono',monospace;font-size:12px}
.editor-topo .atalhos{margin-left:auto}
.recomecar{background:none;border:1px solid #4A4570;border-radius:8px;color:#D8D3F0;font-size:12px;padding:3px 9px}
.editor textarea{display:block;width:100%;min-height:220px;resize:vertical;border:0;outline:none;background:transparent;color:var(--cod-txt);font-size:14px;line-height:1.65;padding:12px 16px;tab-size:4;white-space:pre;overflow:auto}
.editor.mini textarea{min-height:0}
.saida{border-radius:16px;overflow:hidden;background:var(--card);border:2px solid var(--linha)}
.saida-topo{background:var(--fundo-2);padding:6px 14px;font-size:12px;font-weight:800;color:var(--suave);text-transform:uppercase;letter-spacing:.06em}
.saida pre{margin:0;padding:12px 14px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;max-height:240px;overflow:auto;color:var(--texto)}
.saida .err{color:var(--erro);font-weight:500}
.saida .vazio{color:var(--suave)}
.entender{background:var(--aviso-fundo);padding:11px 14px;font-size:14.5px;line-height:1.55;color:var(--aviso-txt)}
.entender:empty{display:none}
.entender b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--aviso-forte);margin-bottom:2px}
.ferramentas{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}
.ferr{background:var(--card);border:2px solid var(--linha);border-radius:12px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--texto-2)}
.ferr:active{background:var(--fundo-2)}
.ferr.ativo{background:var(--acao-claro);border-color:color-mix(in srgb,var(--acao) 40%,var(--linha));color:var(--acao-txt)}
.dicas{background:var(--aviso-fundo);border-radius:16px;padding:14px 16px;margin:18px 0 14px}
.dicas ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.dicas li{font-size:15px;line-height:1.55;color:var(--aviso-txt)}
.dicas li small{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--aviso-forte);margin-bottom:2px}
.dicas li.nova{animation:entrar .22s ease-out}
.dicas-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ia{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--papel) 12%,var(--card));border-radius:18px;padding:12px 14px;margin:0 0 14px}
.ia-ico{font-size:22px;line-height:1}
.ia-texto{line-height:1.55;color:var(--texto-2);white-space:pre-wrap;min-width:0;flex:1;font-size:15px}
.ia-texto small,.sugestao small,.previa small{display:block;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;color:var(--acao-txt)}
.ia-texto pre.cod{margin:8px 0 4px;white-space:pre}
.ia-erro{color:var(--erro)}
.pensando::after{content:"…";animation:piscar 1s infinite}
@keyframes piscar{50%{opacity:.2}}
.sugestao{border:2px dashed var(--papel);background:color-mix(in srgb,var(--papel) 10%,var(--card));border-radius:16px;padding:10px 12px;margin:0 0 14px}
.sugestao pre.cod{margin:6px 0 10px}
.sugestao-acoes{display:flex;gap:8px;flex-wrap:wrap}
.previa{background:var(--card);border-radius:16px;padding:12px 14px;margin:0 0 14px;border:2px solid var(--linha)}
.previa-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.previa small{color:var(--suave);margin:0}
.previa pre.cod{margin:0}
.teclas{display:flex;gap:6px;overflow-x:auto;margin:-2px 0 12px;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.teclas button{flex:none;min-width:42px;height:42px;border:2px solid var(--linha);border-radius:12px;background:var(--card);color:var(--texto);font-weight:600;font-size:16px;padding:0 10px}
.teclas button:active{background:var(--acao-claro)}
.ensaio{background:var(--card);border:2px solid var(--linha);border-radius:18px;overflow:hidden;margin-bottom:14px}
.ensaio-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;border-bottom:2px solid var(--linha);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--suave)}
.cronometro{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--acao-txt)}
.cronometro.longo{color:var(--erro)}
.ensaio textarea{display:block;width:100%;border:0;outline:none;resize:vertical;padding:12px 14px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15.5px;line-height:1.55;background:transparent;color:var(--texto)}
.modelo{display:grid;gap:12px;margin-top:6px}
.modelo-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.modelo-bloco{background:var(--card);border:2px solid var(--linha);border-radius:18px;padding:14px 16px}
.modelo-bloco:first-child{border-color:var(--ok)}
.modelo-bloco p,.modelo-bloco li{color:var(--texto-2);line-height:1.65;font-size:15.5px}
.modelo-bloco ul{padding-left:20px;margin:6px 0 0}
.modelo-bloco.evitar{border-color:var(--erro)}
.checklist{list-style:none;padding:0 !important}
.checklist li{margin:7px 0}
.checklist label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checklist input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok);flex:none}
mark.ajuste{background:var(--aviso-fundo);border:1.5px dashed var(--sol);border-radius:6px;padding:0 5px;color:var(--aviso-txt);font-weight:600}

/* ---------- resultado ---------- */
/* ---------- resultado ---------- */
.resultado{max-width:620px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top)) 20px calc(56px + env(safe-area-inset-bottom))}
.resultado-topo{text-align:center}
.trofeu{display:flex;justify-content:center;gap:4px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.resultado h1{font-size:31px;margin:8px 0 6px;color:var(--texto)}
.resultado-topo > p{color:var(--texto-2);margin:0 0 6px}
.estrelas-grandes{text-align:center;margin:18px 0 0}
.estrelas-grandes .estrelas i{font-size:44px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards}
.estrelas-grandes .estrelas i:nth-child(2){animation-delay:.15s}.estrelas-grandes .estrelas i:nth-child(3){animation-delay:.3s}
.cartoes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 14px}
.cartao{border-radius:18px;padding:3px;text-align:center;background:var(--c,var(--sol))}
.cartao small{display:block;color:#fff;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:5px 2px 6px}
.cartao b{display:block;background:var(--fundo);border-radius:15px;padding:13px 4px;font-size:21px;color:var(--c-esc,var(--sol-esc))}
.c-xp{--c:var(--sol);--c-esc:var(--sol-esc)}.c-acerto{--c:var(--ok);--c-esc:var(--ok-esc)}.c-tempo{--c:var(--papel);--c-esc:color-mix(in srgb,var(--papel) 78%,var(--texto))}
.conquistas{display:grid;gap:10px;margin:6px 0 14px}
.conquista{display:flex;align-items:center;gap:14px;border-radius:18px;padding:12px 16px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards .35s}
.conquista .ic{width:34px;height:34px}
.conquista b{display:block;font-size:16.5px}
.conquista small{display:block;font-size:14px;color:var(--texto-2)}
.fogo-c{background:color-mix(in srgb,var(--fogo) 14%,var(--card))}.fogo-c .ic{color:var(--fogo)}
.meta-c{background:var(--ok-fundo)}.meta-c .ic{color:var(--ok)}
.prot-c{background:color-mix(in srgb,var(--papel) 14%,var(--card))}.prot-c .ic{color:var(--papel)}
.continuar-info{color:var(--suave);font-weight:600;font-size:14px}
.resumo{margin:0 0 22px;background:var(--card);border-radius:20px;padding:16px 18px;border:2px solid var(--linha)}
.resumo h3{font-size:19px;margin:0 0 10px}
.resumo ul{margin:0;padding-left:20px;display:grid;gap:7px}
.resumo li{color:var(--texto-2);line-height:1.55}
.resumo li::marker{color:var(--acao)}
.resultado-acoes{display:grid;gap:14px}
.caixa-fim{background:var(--card);border-radius:20px;padding:16px 18px;margin-bottom:20px;border:2px solid var(--linha)}
.caixa-fim h3{margin:0 0 8px;font-size:19px}
.caixa-fim p,.caixa-fim li{color:var(--texto-2);line-height:1.6}
.caixa-fim pre.cod{margin:10px 0}
.caixa-fim .btn{margin:6px 0 10px}
.aprendeu{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 26px}
.aprendeu span{background:var(--card);font-size:13.5px;font-weight:600;padding:6px 12px;border-radius:99px;border:2px solid var(--linha)}
.confete{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top));width:0;height:0;pointer-events:none;z-index:10}
.confete span{position:absolute;left:-4px;top:-6px;width:8px;height:12px;border-radius:2px;opacity:0;animation:estourar 1.3s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes estourar{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.3)}25%{opacity:1;transform:translate(calc(var(--dx)*.8),calc(var(--dy)*.8)) rotate(calc(var(--r)*.4)) scale(1)}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 220px)) rotate(var(--r)) scale(.9)}}
.toast{position:fixed;top:calc(76px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--texto);color:var(--fundo);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--sombra);animation:fade .2s}

/* ---------- janelas ---------- */
.modal-fundo{position:fixed;inset:0;background:rgba(15,14,24,.5);display:grid;place-items:center;padding:16px;z-index:30;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--fundo);border-radius:24px;max-width:660px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:24px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-fechar{position:absolute;top:14px;right:14px;width:36px;height:36px;border:0;border-radius:12px;background:var(--card-2);font-weight:800;color:var(--texto-2)}
.modal h3{margin:6px 0 8px;font-size:21px}
.modal .resumo{margin:12px 0 8px}
.teoria-cartao{border-bottom:2px solid var(--linha);padding:6px 0 10px}
.teoria-cartao:last-of-type{border-bottom:0}
.teoria-cartao h3{margin:12px 0 4px;font-size:18px}
.teoria-cartao p,.teoria-cartao li{line-height:1.65;color:var(--texto-2);font-size:15.5px}
.teoria-cartao pre.cod{margin:8px 0 6px}
.modal .btn.largo{margin-top:10px}
.modal.senha p{color:var(--texto-2)}
.modal.senha input{width:100%;font-size:16px;padding:12px 14px;border:2px solid var(--linha-2);border-radius:14px;margin:6px 0 14px;background:var(--card);color:var(--texto)}
.senha-erro{color:var(--erro);font-weight:700;margin:-6px 0 12px}
.aviso{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:25;background:var(--aviso-fundo);color:var(--aviso-txt);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14px;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--sombra)}
.aviso code{word-break:break-all}


/* ---------- lição, versão limpa (sobrepõe o que vem acima) ---------- */
.licao-topo-in{padding:12px 16px}
.barra{height:10px}
.barra div::after{display:none}
.topo-btn{border:0;background:var(--card-2);border-radius:12px;padding:8px 12px}
.pagina{border:1px solid var(--linha);border-radius:22px}
.opcao{border:1.5px solid var(--linha);box-shadow:none;border-radius:16px;transition:transform .12s,border-color .15s,background .15s}
.opcao:hover{background:var(--fundo-2)}
.opcao:active{transform:scale(.985);box-shadow:none}
.opcao .num{border:1.5px solid var(--linha-2)}
.opcao.sel{box-shadow:none}
.opcao.ok{box-shadow:none;animation:acerto .35s cubic-bezier(.2,1.6,.4,1)}
.opcao.ruim{box-shadow:none;animation:treme .35s}
@keyframes acerto{40%{transform:scale(1.025)}}
@keyframes treme{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.peca{border:1.5px solid var(--linha);box-shadow:none;border-radius:12px}
.peca:active{transform:scale(.95);box-shadow:none}
.ferr{border:0;background:var(--card-2)}
.saida,.previa,.ensaio,.modelo-bloco,.resumo,.caixa-fim{border-width:1px}
/* o feedback sobe como uma gaveta */
.rodape{border-top:1px solid var(--linha)}
.rodape.certo,.rodape.errado{border-radius:24px 24px 0 0;animation:gaveta .28s cubic-bezier(.3,.7,.3,1)}
@keyframes gaveta{from{transform:translateY(40px);opacity:.4}}
.rodape.certo .btn:not(.branco){background:var(--ok);box-shadow:none}
.rodape.errado .btn:not(.branco){background:var(--erro);box-shadow:none}
.rodape .btn.branco{background:var(--card)}
.fb h3{font-size:21px}
.cartao{border-radius:18px;background:var(--card);border:1px solid var(--linha);padding:12px 6px 14px}
.cartao small{color:var(--suave);padding:0 0 2px}
.cartao b{background:none;border-radius:0;padding:2px 0 0;font-size:22px}
.resultado-acoes .btn{min-height:54px}


/* ---------- refinamento limpo + animações ---------- */
/* uma cor só: a da trilha, na trilha e na lição */
.parte.parte,.licao.licao,.cartao-licao.cartao-licao{--cor:var(--acao)}
.parte-cab small{color:var(--suave)}
.marca{gap:9px;font-size:19px}
.marca-sinal{width:22px;height:22px;border-radius:7px;background:var(--acao);position:relative;flex:none}
.marca-sinal::after{content:"";position:absolute;left:6px;top:6px;width:10px;height:10px;border-radius:3px;background:var(--fundo);transform:rotate(45deg) scale(.75)}
.stats{gap:6px}
.tema-btn{width:38px;height:38px;border:0;border-radius:12px;background:var(--card-2);color:var(--texto-2);display:grid;place-items:center;transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
.tema-btn:active{transform:scale(.9) rotate(-20deg)}
.tema-btn .ic{width:19px;height:19px}
.sigla{--cor-t:var(--acao);width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:16px;letter-spacing:-.02em;
  background:color-mix(in srgb,var(--cor-t) 12%,var(--card));color:color-mix(in srgb,var(--cor-t) 85%,var(--texto))}
.sigla.mini{width:auto;min-width:22px;height:22px;padding:0 5px;border-radius:7px;font-size:11px;display:inline-grid}
.sigla.grande{width:56px;height:56px;font-size:19px;border-radius:16px;margin-bottom:14px}
.saudacao h1{font-size:25px}
.foco{padding:20px;border-radius:24px;box-shadow:none}
.foco-rotulo{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-weight:700;font-size:13.5px;color:var(--texto)}
.foco-rotulo span{color:var(--suave);font-weight:600}
.foco h2{font-size:26px;line-height:1.18;margin:12px 0 6px}
.foco-porque{margin:0 0 18px}
.foco-prog{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.foco-prog small{color:var(--suave);font-weight:600;font-size:13px;white-space:nowrap}
.semana-bloco{background:var(--card);border:1px solid var(--linha);border-radius:22px;padding:16px;margin-bottom:14px}
.semana-topo{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.semana-topo .fogo-txt b{font-size:18px;margin-right:2px}
.meta-txt{color:var(--suave);font-size:13.5px;font-weight:600}.meta-txt b{color:var(--texto)}
.barra-meta{display:block;height:6px;border-radius:99px;background:var(--linha);overflow:hidden;margin-bottom:14px}
.barra-meta i{display:block;height:100%;width:var(--w);border-radius:99px;background:var(--sol);animation:crescer .9s cubic-bezier(.2,.7,.2,1) .2s both}
.bateu .barra-meta i{background:var(--ok)}
@keyframes crescer{from{width:0}}
.li-ico{background:var(--card-2);color:var(--texto-2)}
.etapa-no{font-size:13px;font-weight:800;color:var(--suave);font-variant-numeric:tabular-nums}
.etapa.atual .etapa-no{color:var(--cor-txt)}
.trilha-cabeca h1{font-size:26px}
.ct-ico,.mt-ico{display:none}
/* entrada das seções, uma depois da outra */
.tela > *,.home .caminho-col > *{animation:subir .45s cubic-bezier(.2,.7,.2,1) both}
.tela > :nth-child(2),.home .caminho-col > :nth-child(2){animation-delay:.05s}
.tela > :nth-child(3),.home .caminho-col > :nth-child(3){animation-delay:.1s}
.tela > :nth-child(4),.home .caminho-col > :nth-child(4){animation-delay:.15s}
.tela > :nth-child(n+5),.home .caminho-col > :nth-child(n+5){animation-delay:.2s}
.lista-trilhas > *{animation:subir .4s cubic-bezier(.2,.7,.2,1) both}
.lista-trilhas > :nth-child(2){animation-delay:.04s}.lista-trilhas > :nth-child(3){animation-delay:.08s}.lista-trilhas > :nth-child(4){animation-delay:.12s}.lista-trilhas > :nth-child(5){animation-delay:.16s}
.semana .fez i{animation-delay:.35s}
/* selo de acerto e erro: o círculo cresce e o traço se desenha */
.selo-resp{display:block;overflow:visible}
.selo-resp circle{fill:var(--ok);transform-origin:center;transform-box:fill-box;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.selo-resp.nao circle{fill:var(--erro)}
.selo-resp path{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:desenhar .35s .18s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes desenhar{to{stroke-dashoffset:0}}
.fb-ico .selo-resp{width:44px;height:44px}
.trofeu{position:relative;width:88px;height:88px;margin:0 auto 6px}
.trofeu::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--ok);animation:onda 1.2s .2s cubic-bezier(.2,.7,.2,1) both}
@keyframes onda{from{transform:scale(.8);opacity:.9}to{transform:scale(2.2);opacity:0}}
.fogo-c .ic{animation:acender 1s .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes acender{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.3);filter:drop-shadow(0 0 10px var(--fogo))}100%{transform:scale(1)}}
.cartoes .cartao{animation:subir .4s cubic-bezier(.2,.7,.2,1) both}
.cartoes .cartao:nth-child(1){animation-delay:.45s}.cartoes .cartao:nth-child(2){animation-delay:.55s}.cartoes .cartao:nth-child(3){animation-delay:.65s}
.conquista{animation-delay:.75s}
.cartao b{color:var(--texto)}
.c-xp b{color:var(--sol-esc)}
/* barra da lição: brilho que passa a cada acerto */
.barra div{overflow:hidden}
.barra div.brilha::after{display:block;content:"";position:absolute;inset:0;left:-60%;width:60%;height:100%;top:0;border-radius:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:varrer .7s ease-out forwards}
@keyframes varrer{to{left:110%}}
.licao-nome small{color:var(--suave)}
.pagina-topo{margin-bottom:4px}
/* transição entre telas: a nova sobe de leve; topo e abas ficam parados */
.topo{view-transition-name:topo}
.abas-baixo{view-transition-name:abas}
::view-transition-old(root){animation:vt-sai .16s ease-in forwards}
::view-transition-new(root){animation:vt-entra .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes vt-sai{to{opacity:0}}
@keyframes vt-entra{from{opacity:0;transform:translateY(10px)}}

@media (max-width:900px){
  .home{grid-template-columns:1fr;gap:22px}
  .lateral{position:static}
  .abas-topo{display:none}
  .abas-baixo{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:15;justify-content:space-around;
    background:color-mix(in srgb,var(--fundo) 90%,transparent);backdrop-filter:saturate(1.8) blur(16px);-webkit-backdrop-filter:saturate(1.8) blur(16px);
    border-top:1px solid var(--linha);padding:6px 8px calc(4px + env(safe-area-inset-bottom))}
  .abas-baixo .aba{flex:1;flex-direction:column;gap:2px;padding:6px 4px;font-size:11.5px;max-width:120px}
  .abas-baixo .aba .ic{width:24px;height:24px;transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
  .abas-baixo .aba.ativa .ic{transform:translateY(-1px) scale(1.08)}
  .tela{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
}
@media (max-width:520px){
  .rotulo-btn{display:none}
  .uma-linha .rodape-esq .btn{flex:none;min-width:52px;padding:12px 14px}
  .modelo-bloco{padding:12px 14px}
  .modelo-bloco p,.modelo-bloco li{font-size:15px;line-height:1.6}
  .ensaio textarea{min-height:110px}
  .pagina p,.pagina li{font-size:15.5px}
  .opcao{padding:12px 14px;font-size:15px}
  .topo-in{padding:8px 16px}
  .marca-trio .pers{width:20px;height:20px}
  .tela{padding-left:16px;padding-right:16px;padding-top:12px}
  .saudacao h1{font-size:24px}
  .trilha-cabeca h1{font-size:22px}
  .foco{padding:16px;border-radius:22px}
  .foco-anel{width:80px;height:80px}.foco-anel svg{width:80px;height:80px}.foco-ico{inset:12px;font-size:28px}
  .foco-txt h2{font-size:21px}
  .numeros{grid-template-columns:repeat(2,1fr)}
  .linha-ajuste{flex-wrap:wrap}
  .licao-topo-in{padding:10px 12px;gap:10px}
  .topo-btn span{display:none}
  .corpo-in{padding:14px 16px 32px}
  .corpo h2{font-size:21px}
  .pagina{padding:18px}
  .pagina-topo .pers{width:44px;height:44px}
  .rodape{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .rodape-esq,.rodape-dir{width:100%}
  .rodape-esq .btn,.rodape-dir .btn{flex:1}
  .rodape-in > #principal{flex:1 1 100%}
  .uma-linha .rodape-esq{width:auto}
  .uma-linha .rodape-dir{width:auto;flex:1;flex-wrap:nowrap}
  .fb-ico .pers{width:46px;height:46px}
  .fb-acoes{width:100%}
  .fb-acoes .btn{flex:1}
  .editor textarea{min-height:170px;font-size:13px}
  .editor-topo .atalhos{display:none}
  .recomecar{margin-left:auto}
  .cartoes{gap:8px}
  .cartao b{font-size:17px}
  pre.cod{font-size:12.5px;padding:12px 14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}.anel-svg .anel-cheio{stroke-dashoffset:var(--alvo)}}
</style>
</head>

<script src="/app.js"></script>
